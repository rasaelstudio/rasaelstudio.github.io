<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اطلب صفحتك | رسائل</title>
<meta name="description" content="عبّي طلبك وبيوصلنا عالواتساب، ومنجهّزلك صفحتك بنفس اليوم.">
<meta name="theme-color" content="#561A27">
<link rel="icon" href="../assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --wine: #561A27; --wine-2: #3E121B; --wine-3: #7A2738; --cream: #FBF1E6; --cream-2: #F4E4D3; --pink: #F07C8C; --pink-ink: #C8394F; --ink: #2A0D16; --muted: #7B5C63; --line: #E8D4C2; --err: #B42318; --ease: cubic-bezier(.2, .7, .2, 1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--cream); color: var(--ink); font: 400 16px/1.7 "IBM Plex Sans Arabic", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  h1, h2 { font-family: "El Messiri", serif; font-weight: 700; line-height: 1.3; }
  .top { background: radial-gradient(ellipse 90% 90% at 50% 0%, var(--wine-3), var(--wine) 55%, var(--wine-2)); color: var(--cream); padding: 18px 0 70px; text-align: center; }
  .wrap { width: min(680px, 100% - 32px); margin-inline: auto; }
  .back { display: inline-flex; align-items: center; gap: 8px; font-family: "El Messiri", serif; font-weight: 700; font-size: 20px; text-decoration: none; }
  .back img { width: 34px; height: 34px; border-radius: 9px; }
  .top h1 { font-size: clamp(30px, 7vw, 42px); margin-top: 30px; }
  .top p { color: rgba(251,241,230,.8); }
  form { margin-top: -44px; display: grid; gap: 16px; padding-bottom: 120px; }
  fieldset { border: 1px solid var(--line); background: #fff; border-radius: 22px; padding: 22px 18px; box-shadow: 0 20px 40px -34px rgba(86,26,39,.6); }
  legend { float: right; width: 100%; font-family: "El Messiri", serif; font-weight: 700; font-size: 21px; color: var(--wine); margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  legend .n { width: 30px; height: 30px; border-radius: 50%; background: var(--wine); color: var(--cream); display: grid; place-items: center; font-size: 15px; flex: none; }
  .kinds { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; clear: both; }
  .kind input, .plan input { position: absolute; opacity: 0; pointer-events: none; }
  .kind label { display: flex; flex-direction: column; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 8px; cursor: pointer; text-align: center; font-weight: 700; transition: border-color .2s, background .2s, transform .2s var(--ease); min-height: 44px; }
  /* "other" fills the last row only when it would sit alone */
  .kind:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .kind:last-child:nth-child(odd) label { flex-direction: row; justify-content: center; }
  .kind:last-child:nth-child(odd) .em { width: 44px; height: 44px; font-size: 22px; }
  .kind img { width: 64px; height: 84px; object-fit: cover; border-radius: 10px; }
  .kind .em { width: 64px; height: 84px; border-radius: 10px; background: var(--cream-2); display: grid; place-items: center; font-size: 30px; }
  .kind input:checked + label, .plan input:checked + label { border-color: var(--pink); background: #FFF6F4; box-shadow: 0 0 0 3px rgba(240,124,140,.22); }
  .kind input:focus-visible + label, .plan input:focus-visible + label { outline: 2px solid var(--wine); outline-offset: 2px; }
  .plans { display: grid; gap: 10px; clear: both; }
  .plan label { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 16px; cursor: pointer; transition: border-color .2s, background .2s; }
  .plan b { display: block; }
  .plan small { color: var(--muted); font-size: 14px; }
  .plan .p { font-family: "El Messiri", serif; font-weight: 700; font-size: 20px; white-space: nowrap; }
  .plan .tag { background: var(--pink); color: #fff; font-size: 12px; padding: 1px 10px; border-radius: 20px; margin-inline-start: 6px; vertical-align: 2px; }
  .fields { display: grid; gap: 14px; clear: both; }
  .f label { display: block; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .f label .opt { font-weight: 400; color: var(--muted); font-size: 13px; }
  .f input, .f select, .f textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--cream); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 14px; min-height: 48px; transition: border-color .2s, box-shadow .2s; }
  .f textarea { min-height: 110px; resize: vertical; line-height: 1.7; }
  .f input:focus, .f select:focus, .f textarea:focus { outline: none; border-color: var(--wine); box-shadow: 0 0 0 3px rgba(86,26,39,.12); background: #fff; }
  .f input[type="tel"], .f input[type="url"] { direction: ltr; text-align: right; }
  .f .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .f .err { color: var(--err); font-size: 13px; margin-top: 4px; display: none; }
  .f.bad input, .f.bad select, .f.bad textarea { border-color: var(--err); }
  .f.bad .err { display: block; }
  .f label.check { display: flex; align-items: center; gap: 10px; font-weight: 500; cursor: pointer; min-height: 44px; }
  .check input { width: 22px; height: 22px; accent-color: var(--wine); flex: none; }
  .submit { position: sticky; bottom: 0; padding: 14px 0 calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--cream) 70%, rgba(251,241,230,0)); }
  .submit button { width: 100%; min-height: 56px; border: 0; border-radius: 60px; background: #1FA855; color: #fff; font: inherit; font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; box-shadow: 0 12px 26px -12px rgba(31,168,85,.9); transition: transform .2s var(--ease), background .2s; }
  .submit button:hover { background: #18934A; }
  .submit button:active { transform: scale(.98); }
  .submit button svg { width: 24px; height: 24px; }
  .submit .total { text-align: center; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  .done { display: none; text-align: center; background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 30px 20px; margin-top: -44px; }
  .done h2 { color: var(--wine); font-size: 28px; }
  .done p { color: var(--muted); margin: 8px 0 18px; }
  .done a.btn { display: inline-flex; min-height: 50px; align-items: center; padding: 0 26px; border-radius: 60px; background: #1FA855; color: #fff; font-weight: 700; text-decoration: none; }
  .sent form { display: none; } .sent .done { display: block; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="back" href="../"><img src="../assets/icon.png" alt="">رسائل</a>
    <h1>احكيلنا عن هديتك 💌</h1>
    <p>بتعبّي الطلب، وبيوصلنا عالواتساب برسالة جاهزة</p>
  </div>
</header>

<div class="wrap">
  <form id="order" novalidate>
    <fieldset>
      <legend><span class="n">١</span>شو بدك نعملك؟</legend>
      <div class="kinds">
        <div class="kind"><input type="radio" name="kind" id="k-wedding" value="wedding"><label for="k-wedding"><img src="../assets/wedding-closed.jpg" alt="">دعوة عرس</label></div>
        <div class="kind"><input type="radio" name="kind" id="k-letter" value="letter"><label for="k-letter"><img src="../assets/letter-closed.jpg" alt="">رسالة حب</label></div>
        <div class="kind"><input type="radio" name="kind" id="k-proposal" value="proposal"><label for="k-proposal"><img src="../assets/proposal-closed.jpg" alt="">طلب زواج</label></div>
        <div class="kind"><input type="radio" name="kind" id="k-birthday" value="birthday"><label for="k-birthday"><img src="../assets/birthday-closed.jpg" alt="">عيد ميلاد</label></div>
        <div class="kind"><input type="radio" name="kind" id="k-reveal" value="reveal"><label for="k-reveal"><img src="../assets/reveal-closed.jpg" alt="">صبي ولا بنت؟</label></div>
        <div class="kind"><input type="radio" name="kind" id="k-other" value="other"><label for="k-other"><span class="em">🎁</span>عيد / مناسبة تانية</label></div>
      </div>
    </fieldset>

    <fieldset id="planSet" hidden>
      <legend><span class="n">٢</span>اختار الباقة</legend>
      <div class="plans" id="plans"></div>
    </fieldset>

    <fieldset id="detailSet" hidden>
      <legend><span class="n">٣</span>التفاصيل</legend>
      <div class="fields" id="details"></div>
    </fieldset>

    <fieldset id="youSet" hidden>
      <legend><span class="n">٤</span>معلوماتك</legend>
      <div class="fields" id="you"></div>
    </fieldset>

    <div class="submit" id="submitBar" hidden>
      <div class="total" id="total"></div>
      <button type="submit">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.2z"/></svg>
        ابعت الطلب عالواتساب
      </button>
    </div>
  </form>

  <div class="done" id="done">
    <h2>تقريباً خلصنا 🤍</h2>
    <p>انفتح واتساب ورسالة طلبك جاهزة، بس اضغط «إرسال».<br>إذا عندك صور ابعتها بنفس المحادثة.</p>
    <a class="btn" id="again" target="_blank" rel="noopener">ما انفتح واتساب؟ اضغط هون</a>
  </div>
</div>

<script src="../config.js"></script>
<script>
const R = window.RASAEL;
const KIND_NAME = { wedding: 'دعوة عرس', letter: 'رسالة حب', proposal: 'طلب زواج', birthday: 'عيد ميلاد', reveal: 'كشف جنس المولود', other: 'هدية لمناسبة' };

// The questions for each kind. Order of fields = order in the WhatsApp message.
const FIELDS = {
  wedding: [
    { id: 'groom', label: 'اسم العريس', req: 1 },
    { id: 'bride', label: 'اسم العروس', req: 1 },
    { id: 'groomFam', label: 'عائلة العريس', ph: 'مثال: آل الشامي' },
    { id: 'brideFam', label: 'عائلة العروس', ph: 'مثال: آل العطّار' },
    { id: 'date', label: 'تاريخ العرس', type: 'date', req: 1 },
    { id: 'time', label: 'الوقت', type: 'time' },
    { id: 'venue', label: 'اسم الصالة والمدينة', req: 1, ph: 'مثال: صالة الياسمين، دمشق' },
    { id: 'map', label: 'رابط الموقع من Google Maps', type: 'url', hint: 'افتح الخريطة ← اضغط على المكان ← مشاركة ← نسخ الرابط' },
    { id: 'programme', label: 'برنامج الحفل', type: 'textarea', ph: '٨:٠٠ الاستقبال\n٩:٠٠ الزفّة\n١٠:٠٠ العشاء' },
    { id: 'verse', label: 'شو بدك بأول الدعوة؟', type: 'select', options: ['آية ﴿وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا﴾', 'بسم الله الرحمن الرحيم بس', 'عبارة بدون آية', 'اقترحولي إنتو'] },
    { id: 'rsvp', label: 'رقم واتساب لتأكيد الحضور', type: 'tel', ph: '9639xxxxxxxx', hint: 'الضيوف بيأكدو حضورهم برسالة لهالرقم' },
    { id: 'colors', label: 'ألوان أو طابع بتحبه', ph: 'مثال: أبيض وذهبي، أو متل المثال' },
  ],
  letter: [
    { id: 'to', label: 'لمين الرسالة؟ (الاسم)', req: 1 },
    { id: 'toGender', label: 'اللي رح يقراها: هي ولا هو؟', type: 'select', options: ['هي', 'هو'], req: 1 },
    { id: 'from', label: 'اسمك متل ما بدك يبيّن', req: 1 },
    { id: 'nick', label: 'اسم الدلع اللي بتنادو فيه', ph: 'مثال: حياتي، قلبي…' },
    { id: 'since', label: 'من أيمتى إنتو سوا؟', type: 'date', hint: 'لعدّاد «صرلنا مع بعض»' },
    { id: 'letter', label: 'الرسالة', type: 'textarea', req: 1, ph: 'اكتب من قلبك… أو اكتب «اكتبوها إنتو» واحكيلنا عن قصتكم' },
    { id: 'reasons', label: 'شو بتحب فيه؟ (كل سبب بسطر)', type: 'textarea', ph: 'ضحكتها\nإنها بتفهمني من نظرة' },
    { id: 'story', label: 'محطات من قصتكم (التاريخ وشو صار)', type: 'textarea', ph: 'آذار ٢٠٢٣: أول مرة شفتك\nآب ٢٠٢٤: أول سفرة' },
    { id: 'openWhen', label: 'رسائل «افتحيها لمّا…»', type: 'textarea', ph: 'لمّا تشتاقيلي: …\nلمّا تزعلي: …' },
    { id: 'replyWa', label: 'رقم واتسابك لزر «ردّ عليه»', type: 'tel', ph: '9639xxxxxxxx' },
  ],
  proposal: [
    { id: 'to', label: 'اسمها', req: 1 },
    { id: 'from', label: 'اسمك', req: 1 },
    { id: 'question', label: 'السؤال', type: 'select', options: ['بتقبلي تكوني شريكة عمري؟', 'بتتجوّزيني؟', 'رح اكتب سؤالي بالملاحظات'] },
    { id: 'story', label: 'قصتكم بأربع جمل قصيرة (كل جملة بسطر)', type: 'textarea', ph: 'من أول مرة شفتك فيها…\nصرتِ أول شي بفكّر فيه الصبح…' },
    { id: 'answerWa', label: 'رقم واتسابك (جوابها بيوصلك عليه)', type: 'tel', req: 1, ph: '9639xxxxxxxx' },
  ],
  birthday: [
    { id: 'to', label: 'اسم صاحب/ة العيد', req: 1 },
    { id: 'toGender', label: 'هي ولا هو؟', type: 'select', options: ['هي', 'هو'], req: 1 },
    { id: 'nick', label: 'شو بتناديه/ا؟', ph: 'مثال: سلمى، حياتي، أختي…' },
    { id: 'from', label: 'من مين الهدية؟', req: 1 },
    { id: 'birthDate', label: 'تاريخ الميلاد (مع السنة)', type: 'date', req: 1, hint: 'منه بيطلع العمر عالشموع و«عمرك بالأرقام»' },
    { id: 'showAge', label: 'منبيّن العمر؟', type: 'select', options: ['إي، حطّو عالشموع', 'لا، بدون عمر'] },
    { id: 'message', label: 'رسالتك', type: 'textarea', req: 1, ph: 'اكتب من قلبك… أو اكتب «اكتبوها إنتو» واحكيلنا عنها/عنه' },
    { id: 'wishes', label: 'تمنيات من الأهل والأصحاب (الاسم: التمنية، كل وحدة بسطر)', type: 'textarea', ph: 'ماما: الله يخليلي ياكِ…\nلين: السنة الجاية منسافر سوا!' },
    { id: 'coupons', label: 'قسائم هدايا للحك (كل وحدة بسطر)', type: 'textarea', ph: 'عشا عليّ\nيوم كامل إلك\nسفرة صغيرة' },
    { id: 'replyWa', label: 'رقم واتسابك لزر «ردّ عليه»', type: 'tel', ph: '9639xxxxxxxx' },
  ],
  reveal: [
    { id: 'parents', label: 'أسماء الأهل متل ما بدكن تبيّن', req: 1, ph: 'مثال: أحمد وليلى' },
    { id: 'answer', label: 'مين بيعرف الجواب؟', type: 'select', options: ['أنا بعرف وببعتو بالواتساب', 'الدكتور/صاحب بيبعتلكن ياه، وأنا بتفاجأ مع الكل'], req: 1, hint: 'الجواب ما بيبيّن بالرسالة، منحكيه بس بالخاص' },
    { id: 'revealAt', label: 'أيمتى بينكشف الجواب؟', type: 'datetime-local', hint: 'كل العيلة بتشوفو بنفس اللحظة وين ما كانوا. فاضي = بينكشف أول ما حدا يفتح الرابط' },
    { id: 'due', label: 'أيمتى موعد الولادة؟', ph: 'مثال: آذار ٢٠٢٧' },
    { id: 'babyName', label: 'اسم البيبي (إذا قررتو)', hint: 'بيبيّن بعد ما ينكشف الجواب' },
    { id: 'message', label: 'رسالة للعيلة بعد الكشف', type: 'textarea', ph: 'اكتبوها من قلبكن… أو اكتبوا «اكتبوها إنتو»' },
    { id: 'parentsWa', label: 'رقم واتساب الأهل', type: 'tel', ph: '9639xxxxxxxx', hint: 'التوقعات والمباركات بتوصل عليه' },
  ],
  other: [
    { id: 'occasion', label: 'المناسبة', type: 'select', options: ['معايدة عيد', 'ذكرى زواج', 'اعتذار', 'تخرّج', 'نجاح', 'غير شي'], req: 1 },
    { id: 'to', label: 'لمين الهدية؟ (الاسم)', req: 1 },
    { id: 'from', label: 'من مين؟', req: 1 },
    { id: 'date', label: 'تاريخ المناسبة', type: 'date' },
    { id: 'idea', label: 'احكيلنا فكرتك وشو بدك يكون فيها', type: 'textarea', req: 1 },
  ],
};
const YOU = [
  { id: 'name', label: 'اسمك', req: 1 },
  { id: 'wa', label: 'رقم واتسابك', type: 'tel', req: 1, ph: '9639xxxxxxxx', hint: 'لنبعتلك النسخة الأولى والرابط' },
  { id: 'when', label: 'أيمتى بدك ياها؟', type: 'select', options: ['اليوم', 'بكرا', 'خلال هالأسبوع', 'مو مستعجل'], req: 1 },
  { id: 'photos', label: 'عندي صور رح ابعتها عالواتساب', type: 'check' },
  { id: 'music', label: 'بدي موسيقى', type: 'check' },
  { id: 'notes', label: 'شي بدك تضيفو؟', type: 'textarea', ph: 'أي فكرة أو طلب خاص' },
];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function fieldHtml(f) {
  const opt = f.req ? '' : ' <span class="opt">(اختياري)</span>';
  if (f.type === 'check') return `<div class="f"><label class="check"><input type="checkbox" name="${f.id}">${f.label}</label></div>`;
  const attrs = `id="f-${f.id}" name="${f.id}" ${f.req ? 'required' : ''} ${f.ph ? `placeholder="${esc(f.ph)}"` : ''}`;
  const input = f.type === 'textarea' ? `<textarea ${attrs}></textarea>`
    : f.type === 'select' ? `<select ${attrs}>${f.options.map(o => `<option>${esc(o)}</option>`).join('')}</select>`
    : `<input ${attrs} type="${f.type || 'text'}" ${f.type === 'tel' ? 'inputmode="tel" autocomplete="tel"' : ''} ${f.id === 'name' ? 'autocomplete="name"' : ''}>`;
  return `<div class="f"><label for="f-${f.id}">${f.label}${opt}</label>${input}${f.hint ? `<div class="hint">${f.hint}</div>` : ''}<div class="err">${f.type === 'tel' ? 'اكتب الرقم مع رمز البلد، مثال 9639…' : 'هالخانة لازم تتعبّى'}</div></div>`;
}

let kind = null;
const tiers = () => R.prices[kind === 'wedding' ? 'wedding' : 'gift'];
function setKind(k, planId) {
  kind = k;
  $('plans').innerHTML = tiers().map((p, i) => `
    <div class="plan"><input type="radio" name="plan" id="p-${p.id}" value="${p.id}" ${(planId ? p.id === planId : p.best) ? 'checked' : ''}>
    <label for="p-${p.id}"><span><b>${p.name}${p.best ? '<span class="tag">الأفضل</span>' : ''}</b><small>${p.desc}</small></span><span class="p">${R.fmt(p.price)}</span></label></div>`).join('');
  $('details').innerHTML = FIELDS[k].map(fieldHtml).join('');
  if (!$('you').innerHTML) $('you').innerHTML = YOU.map(fieldHtml).join('');
  ['planSet', 'detailSet', 'youSet', 'submitBar'].forEach(id => $(id).hidden = false);
  updateTotal();
}
function updateTotal() {
  const p = tiers().find(t => t.id === (document.querySelector('[name=plan]:checked') || {}).value);
  $('total').textContent = p ? `${KIND_NAME[kind]} · ${p.name} · ${R.fmt(p.price)} (بتدفع بعد ما تشوف أول نسخة)` : '';
}
document.querySelectorAll('[name=kind]').forEach(r => r.addEventListener('change', () => { setKind(r.value); $('planSet').scrollIntoView({ behavior: 'smooth', block: 'start' }); }));
$('plans').addEventListener('change', updateTotal);

// arriving from the home page: ?kind=wedding&plan=popular
const q = new URLSearchParams(location.search);
if (FIELDS[q.get('kind')]) { $('k-' + q.get('kind')).checked = true; setKind(q.get('kind'), q.get('plan')); }

const normTel = v => v.replace(/[^\d]/g, '').replace(/^00/, '').replace(/^0(9\d{8})$/, '963$1');
function valid() {
  let first = null;
  document.querySelectorAll('#order .f').forEach(box => {
    const el = box.querySelector('input:not([type=checkbox]), select, textarea'); if (!el) return;
    const v = el.value.trim();
    const bad = (el.required && !v) || (el.type === 'tel' && v && normTel(v).length < 10);
    box.classList.toggle('bad', bad);
    if (bad && !first) first = el;
  });
  if (first) { first.focus({ preventScroll: true }); first.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  return !first;
}
document.addEventListener('input', e => e.target.closest('.f.bad')?.classList.remove('bad'));

$('order').addEventListener('submit', e => {
  e.preventDefault();
  if (!kind) { document.querySelector('.kinds').scrollIntoView({ behavior: 'smooth' }); return; }
  if (!valid()) return;
  const fd = new FormData($('order'));
  const plan = tiers().find(t => t.id === fd.get('plan'));
  const code = 'R-' + Date.now().toString(36).slice(-5).toUpperCase();
  const line = f => {
    const v = f.type === 'check' ? (fd.get(f.id) ? 'إي' : '') : String(fd.get(f.id) || '').trim();
    if (!v) return '';
    const val = f.type === 'tel' ? normTel(v) : v;
    return val.includes('\n') ? `*${f.label}:*\n${val}` : `*${f.label}:* ${val}`;
  };
  const msg = [
    `💌 *طلب جديد ${code}*`,
    `*النوع:* ${KIND_NAME[kind]}`,
    `*الباقة:* ${plan.name} (${R.fmt(plan.price)})`,
    '',
    '— التفاصيل —',
    ...FIELDS[kind].map(line).filter(Boolean),
    '',
    '— معلوماتي —',
    ...YOU.map(line).filter(Boolean),
  ].join('\n');
  const url = `https://wa.me/${R.whatsapp}?text=${encodeURIComponent(msg)}`;
  $('again').href = url;
  document.body.classList.add('sent');
  scrollTo({ top: 0 });
  location.href = url;
});
</script>
</body>
</html>
