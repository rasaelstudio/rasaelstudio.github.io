<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعوة خطوبة 💍</title>
<!-- Link preview (WhatsApp / Instagram). Change per client. -->
<meta property="og:title" content="دعوة خطوبة ليث وياسمين 💍">
<meta property="og:description" content="يسعدنا تكونوا معنا بهالليلة 🤍">
<meta name="theme-color" content="#0B0F1E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;300;400;600&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0B0F1E; --night-2: #11172C; --card: #141B33; --line: rgba(212,175,106,.28);
    --gold: #D4AF6A; --gold-hi: #F5E3B3; --gold-lo: #9C7A3C; --cream: #F3EADB; --muted: #9EA3B8; --rose: #D9A3A8;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; background: var(--night); }
  body { background: radial-gradient(ellipse 120% 60% at 50% 0%, #18203F 0%, var(--night) 60%); background-attachment: fixed; color: var(--cream); font: 300 17px/1.95 "Alexandria", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  body.locked { overflow: hidden; height: 100svh; }
  button, input { font: inherit; }
  img { display: block; max-width: 100%; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 60; pointer-events: none; }
  main, .hero { position: relative; z-index: 1; }

  /* gold foil: a moving highlight across metallic gold */
  .foil { background: linear-gradient(100deg, #9C7A3C 0%, #E8CF95 20%, #FFF6DC 28%, #D4AF6A 40%, #8E6B33 58%, #E8CF95 76%, #FFF6DC 82%, #9C7A3C 100%); background-size: 260% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: foil 7s linear infinite; }
  @keyframes foil { from { background-position: 0 0; } to { background-position: -260% 0; } }
  .serif { font-family: "Scheherazade New", serif; }
  .kick { display: inline-flex; align-items: center; gap: 14px; font-size: 12px; font-weight: 400; letter-spacing: .4em; color: var(--gold); }
  .kick::before, .kick::after { content: ""; width: 34px; height: 1px; background: var(--gold); opacity: .7; }

  /* ornament: line, eight-point star, line */
  .orn { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 26px auto; }
  .orn i { display: block; width: 60px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .orn i:last-child { transform: scaleX(-1); }
  .orn svg { width: 16px; height: 16px; }

  /* ---------- hero ---------- */
  .hero { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: calc(56px + env(safe-area-inset-top)) 22px calc(60px + env(safe-area-inset-bottom)); overflow: hidden; }
  .moon { position: absolute; top: calc(26px + env(safe-area-inset-top)); left: 50%; width: 46px; margin-left: -23px; opacity: .9; filter: drop-shadow(0 0 10px rgba(245,227,179,.45)); }
  .to { font-size: 15px; color: var(--rose); min-height: 1.95em; }
  .rings { position: relative; width: 280px; height: 200px; margin: 20px 0 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; outline: none; }
  .rings:focus-visible { outline: 1px solid var(--gold); outline-offset: 10px; border-radius: 24px; }
  .rings svg { width: 100%; height: 100%; overflow: visible; }
  #flash { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,246,220,.95), rgba(245,227,179,.4) 45%, rgba(212,175,106,0)); opacity: 0; pointer-events: none; }
  .hint { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 10px; letter-spacing: .06em; }
  .hint .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(2); opacity: .3; } }
  .names { display: none; margin-top: 4px; }
  .names .n { display: block; font-family: "Scheherazade New", serif; font-weight: 700; font-size: clamp(64px, 20vw, 104px); line-height: 1.15; padding: 0 .1em; }
  .names .and { display: block; font-family: "Scheherazade New", serif; font-size: 30px; color: var(--rose); line-height: 1.2; }
  .h-sub { display: none; margin-top: 14px; font-size: 15px; color: var(--muted); letter-spacing: .04em; }
  .h-date { display: none; margin-top: 6px; font-size: 14px; letter-spacing: .3em; color: var(--gold-hi); }
  .cue { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%; width: 22px; height: 36px; margin-left: -11px; border: 1px solid var(--gold); border-radius: 12px; opacity: 0; }
  .cue::after { content: ""; position: absolute; left: 50%; top: 7px; width: 2px; height: 7px; margin-left: -1px; border-radius: 2px; background: var(--gold-hi); animation: cue 1.8s infinite; }
  @keyframes cue { 0% { transform: translateY(0); opacity: 1; } 80% { transform: translateY(12px); opacity: 0; } 100% { opacity: 0; } }

  /* ---------- sections ---------- */
  /* things slide in from the sides; clip them so phones never widen the page */
  section { position: relative; padding: 90px 22px; overflow-x: hidden; overflow-x: clip; }
  .wrap { width: min(520px, 100%); margin-inline: auto; text-align: center; }
  .sec-t { font-family: "Scheherazade New", serif; font-weight: 700; font-size: clamp(34px, 10vw, 46px); line-height: 1.35; margin-top: 10px; }

  /* the invitation card */
  .card { position: relative; padding: 64px 28px 54px; background: rgba(20,27,51,.82); border-radius: 4px; box-shadow: 0 50px 90px -50px rgba(0,0,0,.8); }
  .card .frame { position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); pointer-events: none; overflow: visible; }
  .card .frame.in { inset: 16px; width: calc(100% - 32px); height: calc(100% - 32px); }
  .card .frame rect { fill: none; stroke: var(--gold); stroke-width: 1; }
  .card .frame rect.in { stroke-width: .6; opacity: .6; }
  .corner { position: absolute; width: 46px; height: 46px; }
  .corner.tr { top: 4px; right: 4px; } .corner.tl { top: 4px; left: 4px; transform: scaleX(-1); }
  .corner.br { bottom: 4px; right: 4px; transform: scaleY(-1); } .corner.bl { bottom: 4px; left: 4px; transform: scale(-1, -1); }
  .mono { position: relative; width: 126px; height: 126px; margin: 0 auto 26px; }
  .mono svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .mono svg rect { fill: none; stroke: var(--gold); stroke-width: 1.2; }
  .mono b { position: absolute; inset: 0; display: grid; place-items: center; font-family: "Scheherazade New", serif; font-weight: 700; font-size: 38px; line-height: 1; padding-top: 6px; }
  .verse { font-family: "Scheherazade New", serif; font-size: 22px; color: var(--gold-hi); }
  .il { display: block; }
  .orn.il { display: flex; }
  .inv { font-size: 17px; line-height: 2.1; color: var(--cream); }
  .inv .fam { font-family: "Scheherazade New", serif; font-weight: 700; font-size: 23px; color: var(--cream); }
  .inv .cpl { margin: 18px 0 8px; font-family: "Scheherazade New", serif; font-weight: 700; font-size: clamp(38px, 11vw, 50px); line-height: 1.4; }
  .inv .muted { color: var(--muted); }

  /* date */
  .date { overflow: hidden; }
  .when { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-top: 30px; }
  .when .side { font-size: 15px; letter-spacing: .08em; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--gold-hi); }
  .when .day { font-family: "Scheherazade New", serif; font-weight: 700; font-size: 112px; line-height: 1.05; padding: 0 .05em; }
  .month { font-family: "Scheherazade New", serif; font-size: 26px; margin-top: 6px; }
  .hijri { font-size: 14px; color: var(--muted); }
  .cd { display: flex; justify-content: center; gap: 10px; margin-top: 34px; }
  .cd div { width: 74px; padding: 14px 0 8px; border: 1px solid var(--line); border-radius: 3px; background: rgba(20,27,51,.6); }
  .cd b { display: block; font-family: "Scheherazade New", serif; font-weight: 700; font-size: 34px; line-height: 1.05; color: var(--gold-hi); }
  .cd span { font-size: 11px; color: var(--muted); letter-spacing: .1em; }
  .cd-done { margin-top: 30px; font-family: "Scheherazade New", serif; font-size: 26px; color: var(--gold-hi); }

  .btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 28px; border-radius: 60px; border: 1px solid var(--gold); background: transparent; color: var(--gold-hi); font-size: 15px; font-weight: 400; letter-spacing: .03em; cursor: pointer; text-decoration: none; overflow: hidden; transition: transform .2s var(--ease), background .3s, color .3s; -webkit-tap-highlight-color: transparent; }
  .btn::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255,246,220,.35), transparent); transform: skewX(-20deg); animation: sheen 4.5s ease-in-out infinite; }
  @keyframes sheen { 0%, 70% { left: -60%; } 100% { left: 130%; } }
  .btn:active { transform: scale(.96); }
  .btn.solid { background: linear-gradient(100deg, #B8914D, #F1D9A0 45%, #C9A35E); color: var(--night); border-color: transparent; font-weight: 600; }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 28px; }

  /* venue */
  .pin { width: 56px; height: 56px; margin: 0 auto; overflow: visible; }
  .pin path, .pin circle { fill: none; stroke: var(--gold); stroke-width: 1.1; }
  .venue { font-family: "Scheherazade New", serif; font-weight: 700; font-size: clamp(32px, 9.5vw, 42px); line-height: 1.4; margin-top: 14px; }
  .addr { color: var(--muted); }

  /* programme: a gold line that fills as you scroll */
  .prog { position: relative; margin: 40px auto 0; width: min(330px, 100%); text-align: right; list-style: none; }
  .prog .track, .prog .fill { position: absolute; top: 10px; bottom: 10px; right: 84px; width: 1px; background: var(--line); }
  .prog .fill { background: linear-gradient(var(--gold-hi), var(--gold)); transform-origin: top; transform: scaleY(0); box-shadow: 0 0 8px rgba(245,227,179,.6); }
  .prog li { position: relative; display: grid; grid-template-columns: 84px 1fr; align-items: center; padding: 16px 0; }
  .prog li::after { content: ""; position: absolute; right: 79px; top: 50%; width: 11px; height: 11px; margin-top: -6px; border-radius: 50%; background: var(--night); border: 1px solid var(--gold); transition: background .4s, box-shadow .4s; }
  .prog li.on::after { background: var(--gold-hi); box-shadow: 0 0 12px var(--gold-hi); }
  .prog .t { font-family: "Scheherazade New", serif; font-weight: 700; font-size: 21px; color: var(--gold-hi); padding-left: 18px; text-align: left; white-space: nowrap; }
  .prog .x { padding-right: 26px; font-size: 17px; opacity: .55; transition: opacity .4s; }
  .prog li.on .x { opacity: 1; }

  /* dress colours: glowing orbs */
  .orbs { display: flex; justify-content: center; gap: 18px; margin-top: 30px; }
  .orbs span { width: 58px; height: 58px; border-radius: 50%; box-shadow: 0 0 0 1px var(--gold), 0 0 0 6px var(--night), 0 0 0 7px var(--line), 0 0 30px -4px currentColor; }
  .note { margin-top: 22px; color: var(--cream); }

  /* story */
  .story { margin-top: 34px; display: grid; gap: 14px; }
  .story li { list-style: none; text-align: right; padding: 18px 20px; border: 1px solid var(--line); border-radius: 3px; background: rgba(20,27,51,.6); }
  .story .d { font-size: 12px; letter-spacing: .14em; color: var(--gold); }
  .story .x { font-family: "Scheherazade New", serif; font-size: 22px; line-height: 1.7; }

  .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 30px; }
  .gallery img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 3px; border: 1px solid var(--line); }
  .gallery img:first-child { grid-column: 1 / -1; aspect-ratio: 4 / 3; }

  /* rsvp */
  .rsvp-card { margin-top: 30px; padding: 30px 22px; border: 1px solid var(--line); border-radius: 4px; background: rgba(20,27,51,.75); display: grid; gap: 16px; text-align: right; }
  .rsvp-card label { font-size: 13px; color: var(--muted); letter-spacing: .04em; }
  .rsvp-card input[type=text] { width: 100%; min-height: 50px; border: 0; border-bottom: 1px solid var(--gold); background: transparent; padding: 0 2px; font-size: 18px; color: var(--cream); border-radius: 0; }
  .rsvp-card input[type=text]::placeholder { color: rgba(158,163,184,.6); }
  .rsvp-card input[type=text]:focus { outline: none; border-bottom-width: 2px; border-bottom-color: var(--gold-hi); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button { min-height: 52px; border-radius: 3px; border: 1px solid var(--line); background: transparent; color: var(--cream); font-size: 15px; cursor: pointer; transition: background .25s, color .25s, border-color .25s; }
  .seg button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--night); font-weight: 600; }
  .step { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 3px; padding: 4px; }
  .step button { width: 46px; height: 46px; border: 0; border-radius: 3px; background: rgba(212,175,106,.12); color: var(--gold-hi); font-size: 22px; cursor: pointer; }
  .step b { font-family: "Scheherazade New", serif; font-weight: 700; font-size: 26px; color: var(--gold-hi); }
  .err { color: var(--rose); font-size: 14px; min-height: 1.4em; }
  .by { font-size: 14px; color: var(--muted); }

  .closing { padding-bottom: 40px; }
  .closing .dua { font-family: "Scheherazade New", serif; font-size: 26px; line-height: 1.9; text-wrap: balance; }
  .closing .wait { margin-top: 26px; font-family: "Scheherazade New", serif; font-weight: 700; font-size: clamp(40px, 12vw, 56px); line-height: 1.3; }
  .credit { position: relative; z-index: 1; text-align: center; font-size: 12px; color: var(--muted); padding: 20px 0 calc(26px + env(safe-area-inset-bottom)); letter-spacing: .06em; }
  .rv { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .foil, .btn::after, .hint .dot, .cue::after { animation: none !important; } .rv { opacity: 1 !important; } }
</style>
</head>
<body class="locked">
<canvas id="sky"></canvas>
<canvas id="fx"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E6B33"/><stop offset=".3" stop-color="#F5E3B3"/><stop offset=".5" stop-color="#C9A35E"/><stop offset=".72" stop-color="#FFF4D2"/><stop offset="1" stop-color="#9C7A3C"/>
    </linearGradient>
    <linearGradient id="gRose" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8F6450"/><stop offset=".35" stop-color="#F2CDB6"/><stop offset=".6" stop-color="#C99A7A"/><stop offset=".8" stop-color="#FBE3D2"/><stop offset="1" stop-color="#8F6450"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <symbol id="star8" viewBox="-12 -12 24 24"><rect x="-7" y="-7" width="14" height="14" fill="#D4AF6A"/><rect x="-7" y="-7" width="14" height="14" fill="#D4AF6A" transform="rotate(45)"/><circle r="3" fill="#0B0F1E"/></symbol>
  <symbol id="corner" viewBox="0 0 46 46"><path d="M44 2H14C8 2 2 8 2 14v30" fill="none" stroke="#D4AF6A" stroke-width="1"/><path d="M44 8H18c-5 0-10 5-10 10v26" fill="none" stroke="#D4AF6A" stroke-width=".6" opacity=".6"/><path d="M8 2l4 4-4 4-4-4z" fill="#F5E3B3" transform="translate(-2 -2)"/></symbol>
</svg>

<!-- hero: tap the rings -->
<header class="hero" id="hero">
  <svg class="moon" viewBox="0 0 46 46" aria-hidden="true"><path d="M30 4a20 20 0 1 0 12 30A16 16 0 1 1 30 4z" fill="none" stroke="#F5E3B3" stroke-width="1.2"/></svg>
  <p class="to" id="to"></p>
  <p class="kick" id="kicker"></p>
  <div class="rings" id="rings" role="button" tabindex="0" aria-label="المحابس">
    <span id="flash"></span>
    <svg viewBox="-140 -100 280 200" aria-hidden="true">
      <g filter="url(#glow)">
        <!-- B under A, then a slice of B over A: linked rings -->
        <g id="ringB"><circle r="56" fill="none" stroke="url(#gRose)" stroke-width="8"/></g>
        <g id="ringA">
          <circle r="60" fill="none" stroke="url(#gGold)" stroke-width="9"/>
          <path d="M-10 -68l10-15 10 15-10 9z" fill="#FFFFFF" stroke="#F5E3B3" stroke-width="1"/>
          <path d="M0 -83v24M-10 -68h20M-5 -75.5l10 15M5 -75.5l-10 15" stroke="#DCE6F5" stroke-width=".6"/>
        </g>
        <g id="ringBtop" clip-path="url(#topclip)"><circle r="56" fill="none" stroke="url(#gRose)" stroke-width="8"/></g>
      </g>
      <defs><clipPath id="topclip"><rect x="-52" y="-72" width="38" height="34"/></clipPath></defs>
    </svg>
  </div>
  <p class="hint" id="hint"><span class="dot"></span>اضغط لتلتقي المحابس</p>
  <div class="names" id="names"><span class="n foil" id="n1"></span><span class="and">و</span><span class="n foil" id="n2"></span></div>
  <p class="h-sub" id="hSub">يسعدنا تشاركونا أحلى ليلة</p>
  <p class="h-date" id="hDate"></p>
  <span class="cue" id="cue"></span>
</header>

<main>
  <section>
    <div class="wrap">
      <div class="card" id="card">
        <svg class="frame" aria-hidden="true"><rect width="100%" height="100%" pathLength="1"/></svg>
        <svg class="frame in" aria-hidden="true"><rect class="in" width="100%" height="100%" pathLength="1"/></svg>
        <svg class="corner tr" aria-hidden="true"><use href="#corner"/></svg><svg class="corner tl" aria-hidden="true"><use href="#corner"/></svg>
        <svg class="corner br" aria-hidden="true"><use href="#corner"/></svg><svg class="corner bl" aria-hidden="true"><use href="#corner"/></svg>
        <div class="mono"><svg viewBox="-70 -70 140 140" aria-hidden="true"><rect x="-46" y="-46" width="92" height="92" pathLength="1"/><rect x="-46" y="-46" width="92" height="92" transform="rotate(45)" pathLength="1"/></svg><b class="foil" id="mono"></b></div>
        <p class="verse il" id="verse"></p>
        <div class="orn il"><i></i><svg><use href="#star8"/></svg><i></i></div>
        <div class="inv" id="inv"></div>
      </div>
    </div>
  </section>

  <section class="date" id="dateSec">
    <div class="wrap">
      <p class="kick rv">الموعد</p>
      <div class="when"><span class="side" id="wDay"></span><span class="day foil" id="wNum"></span><span class="side" id="wTime"></span></div>
      <p class="month rv" id="wMonth"></p>
      <p class="hijri rv" id="wHijri"></p>
      <div class="cd rv" id="cd"></div>
      <div class="btns rv"><button class="btn" id="calBtn">ذكّرني بالموعد ✦</button></div>
    </div>
  </section>

  <section id="venueSec">
    <div class="wrap">
      <svg class="pin" viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M12 22s-7.5-6.6-7.5-12.2a7.5 7.5 0 0 1 15 0C19.5 15.4 12 22 12 22z"/><circle pathLength="1" cx="12" cy="9.8" r="2.6"/></svg>
      <p class="kick rv" style="margin-top:14px">المكان</p>
      <p class="venue foil rv" id="venue"></p>
      <p class="addr rv" id="addr"></p>
      <div class="btns rv"><a class="btn solid" id="mapBtn" target="_blank" rel="noopener">افتح الموقع عالخريطة</a></div>
      <ul class="prog" id="prog"><span class="track"></span><span class="fill" id="progFill"></span></ul>
    </div>
  </section>

  <section id="dressSec">
    <div class="wrap">
      <p class="kick rv">اللبس</p>
      <h2 class="sec-t foil rv">ألوان السهرة</h2>
      <div class="orbs" id="orbs"></div>
      <p class="note rv" id="dressNote"></p>
    </div>
  </section>

  <section id="storySec">
    <div class="wrap">
      <p class="kick rv">حكايتنا</p>
      <h2 class="sec-t foil rv">من أول نظرة… لهون</h2>
      <ul class="story" id="story"></ul>
    </div>
  </section>

  <section id="gallerySec" style="padding-top:0">
    <div class="wrap"><div class="gallery" id="gallery"></div></div>
  </section>

  <section id="rsvpSec">
    <div class="wrap">
      <p class="kick rv">تأكيد الحضور</p>
      <h2 class="sec-t foil rv">رح تكونوا معنا؟</h2>
      <p class="by rv" id="by"></p>
      <div class="rsvp-card rv">
        <div><label for="rName">الاسم</label><input type="text" id="rName" autocomplete="name" placeholder="اسمك أو اسم العيلة"></div>
        <div class="seg" role="group" aria-label="الحضور"><button type="button" data-v="yes" aria-pressed="false">إن شاء الله جايين</button><button type="button" data-v="no" aria-pressed="false">للأسف ما منقدر</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
/* =====================================================================

const ENGAGE = {

  groom: 'ليث',
  bride: 'ياسمين',

  brideFamily: 'السيد خالد النجّار وعقيلته',
  date: '2026-11-20T19:00:00+03:00', // the party's local time, with its UTC offset
  verse: '﴿وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً﴾',   // '' = none
  venue: { name: 'مطعم نارنج', address: 'دمشق، باب توما', map: 'https://maps.google.com/?q=Naranj+Restaurant+Damascus' },
  programme: [                       // optional; empty list = hidden
    { time: '19:00', title: 'الاستقبال' },
    { time: '20:00', title: 'لبس المحابس' },

  story: [                           // optional; empty list = hidden
    { when: 'صيف ٢٠٢٤', text: 'أول مرة التقينا… بعرس صاحبنا.' },

  ],
  photos: [],                        // optional: file names next to this page
  rsvpWhatsapp: '963983896568',      // replies go to this number ('' = RSVP hidden)
  rsvpBy: '2026-11-15',              // optional "please reply by"
  dua: 'بارك الله لهما، وبارك عليهما، وجمع بينهما في خير',

};
/* ===================================================================== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const AR = 'ar-SY-u-nu-arab';
const num = n => new Intl.NumberFormat(AR).format(n);
const two = n => new Intl.NumberFormat(AR, { minimumIntegerDigits: 2 }).format(n);
const arDigits = s => String(s).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const hasGsap = typeof gsap !== 'undefined';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const when = new Date(ENGAGE.date);
// the date is shown in the party's own time zone, whatever the guest's phone says
const tz = (() => { const m = ENGAGE.date.match(/([+-])(\d\d):(\d\d)$/); return m ? `Etc/GMT${m[1] === '+' ? '-' : '+'}${+m[2]}` : undefined; })();
const fmt = (o, loc = AR) => new Intl.DateTimeFormat(loc, { timeZone: tz, ...o }).format(when);
const guest = (new URLSearchParams(location.search).get('g') || '').trim().slice(0, 60);   // personal link: ?g=عائلة الأحمد

/* ---------- texts ---------- */
$('to').textContent = guest ? `إلى حضرة ${guest}` : '';
$('kicker').textContent = `دعوة ${ENGAGE.kind}`;
$('n1').textContent = ENGAGE.groom; $('n2').textContent = ENGAGE.bride;
$('hDate').textContent = fmt({ day: 'numeric', month: 'long', year: 'numeric' });
$('mono').textContent = `${ENGAGE.groom.trim()[0]} ${ENGAGE.bride.trim()[0]}`;
$('verse').textContent = ENGAGE.verse; if (!ENGAGE.verse) $('verse').remove();
$('inv').innerHTML = [
  `<span class="il muted">يتشرّف</span>`,
  `<span class="il fam">${esc(ENGAGE.groomFamily)}</span>`,
  `<span class="il muted">و</span>`,
  `<span class="il fam">${esc(ENGAGE.brideFamily)}</span>`,
  `<span class="il">بدعوتكم لمشاركتهم فرحة ${esc(ENGAGE.kind)} ${ENGAGE.kind === 'خطوبة' ? 'أبنائهم' : 'ولديهم'}</span>`,
  `<span class="il cpl foil">${esc(ENGAGE.groom)} و${esc(ENGAGE.bride)}</span>`,
  `<span class="il muted">ووجودكم بيكمّل فرحتنا 🤍</span>`].join('');
$('wDay').textContent = fmt({ weekday: 'long' });
$('wNum').textContent = fmt({ day: 'numeric' });
$('wTime').textContent = fmt({ hour: 'numeric', minute: '2-digit' });
$('wMonth').textContent = fmt({ month: 'long', year: 'numeric' });
try { $('wHijri').textContent = fmt({ day: 'numeric', month: 'long', year: 'numeric' }, 'ar-SA-u-ca-islamic-umalqura-nu-arab'); } catch { $('wHijri').remove(); }
$('venue').textContent = ENGAGE.venue.name;
$('addr').textContent = ENGAGE.venue.address;
if (ENGAGE.venue.map) $('mapBtn').href = ENGAGE.venue.map; else $('mapBtn').remove();
if (ENGAGE.programme.length) $('prog').insertAdjacentHTML('beforeend', ENGAGE.programme.map(p => `<li><span class="t">${esc(arDigits(p.time))}</span><span class="x">${esc(p.title)}</span></li>`).join('')); else $('prog').remove();
if (ENGAGE.dress.colors.length) { $('orbs').innerHTML = ENGAGE.dress.colors.map(c => `<span style="background:${esc(c)};color:${esc(c)}"></span>`).join(''); $('dressNote').textContent = ENGAGE.dress.note; } else $('dressSec').remove();
if (ENGAGE.story.length) $('story').innerHTML = ENGAGE.story.map(s => `<li><span class="d">${esc(s.when)}</span><p class="x">${esc(s.text)}</p></li>`).join(''); else $('storySec').remove();
if (ENGAGE.photos.length) $('gallery').innerHTML = ENGAGE.photos.map(p => `<img src="${esc(p)}" alt="" loading="lazy">`).join(''); else $('gallerySec').remove();
$('dua').textContent = ENGAGE.dua;
$('sign').textContent = `${ENGAGE.groom} و${ENGAGE.bride}`;
$('credit').textContent = `صُنعت بحب 🤍 ${ENGAGE.credit}`;

/* ---------- the night sky: stars (parallax), drifting gold dust, shooting stars, sparkles ---------- */
const sky = $('sky'), sx = sky.getContext('2d'), fxc = $('fx'), fx = fxc.getContext('2d');
let W = 0, H = 0;
function size() { const r = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; for (const c of [sky, fxc]) { c.width = W * r; c.height = H * r; c.getContext('2d').setTransform(r, 0, 0, r, 0, 0); } }
size(); addEventListener('resize', size);
const stars = Array.from({ length: 150 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.1 + .25, d: Math.random() * .25 + .03, p: Math.random() * 6.3, s: Math.random() * 1.5 + .5 }));
const dust = Array.from({ length: 26 }, () => ({ x: Math.random(), y: Math.random(), v: Math.random() * .00025 + .0001, r: Math.random() * 1.4 + .6, p: Math.random() * 6.3 }));
let shoot = null, nextShoot = 2500, parts = [];
function drawSky(t) {
  sx.clearRect(0, 0, W, H);
  const sc = scrollY;
  for (const s of stars) {
    const y = ((s.y * H - sc * s.d) % H + H) % H, a = .35 + .65 * (reduceMotion ? .7 : (Math.sin(t / 1000 * s.s + s.p) * .5 + .5));
    sx.globalAlpha = a; sx.fillStyle = '#F3EADB'; sx.beginPath(); sx.arc(s.x * W, y, s.r, 0, 6.3); sx.fill();
  }
  if (!reduceMotion) {
    for (const g of dust) {
      g.y -= g.v * 16; if (g.y < -.02) { g.y = 1.02; g.x = Math.random(); }
      const x = g.x * W + Math.sin(t / 1400 + g.p) * 14;
      sx.globalAlpha = .55; sx.fillStyle = '#E8CF95'; sx.shadowColor = '#F5E3B3'; sx.shadowBlur = 8;
      sx.beginPath(); sx.arc(x, g.y * H, g.r, 0, 6.3); sx.fill(); sx.shadowBlur = 0;
    }
    if (!shoot && t > nextShoot) { shoot = { x: Math.random() * W * .6 + W * .3, y: Math.random() * H * .3, t0: t }; nextShoot = t + 6000 + Math.random() * 6000; }
    if (shoot) {
      const k = (t - shoot.t0) / 900;
      if (k > 1) shoot = null;
      else {
        const x = shoot.x - k * 260, y = shoot.y + k * 130, grd = sx.createLinearGradient(x, y, x + 90, y - 45);
        grd.addColorStop(0, 'rgba(255,246,220,.95)'); grd.addColorStop(1, 'rgba(255,246,220,0)');
        sx.globalAlpha = 1 - k; sx.strokeStyle = grd; sx.lineWidth = 1.4; sx.beginPath(); sx.moveTo(x, y); sx.lineTo(x + 90, y - 45); sx.stroke();
      }
    }
  }
  sx.globalAlpha = 1;
  // gold particles (bursts and finger sparkles)
  fx.clearRect(0, 0, W, H);
  parts = parts.filter(p => p.l < p.max);
  for (const p of parts) {
    p.l++; p.vy += p.g; p.vx *= .97; p.vy *= .97; p.x += p.vx; p.y += p.vy;
    const a = 1 - p.l / p.max;
    fx.globalAlpha = a; fx.fillStyle = p.c; fx.shadowColor = '#F5E3B3'; fx.shadowBlur = 10;
    if (p.star) { fx.save(); fx.translate(p.x, p.y); fx.rotate(p.l / 12); fx.fillRect(-p.r, -p.r / 4, p.r * 2, p.r / 2); fx.fillRect(-p.r / 4, -p.r, p.r / 2, p.r * 2); fx.restore(); }
    else { fx.beginPath(); fx.arc(p.x, p.y, p.r, 0, 6.3); fx.fill(); }
  }
  fx.shadowBlur = 0; fx.globalAlpha = 1;
  requestAnimationFrame(drawSky);
}
requestAnimationFrame(drawSky);
const GOLDS = ['#F5E3B3', '#D4AF6A', '#FFF6DC', '#E8CF95', '#C99A7A'];
function burst(x, y, n = 90, speed = 7) {
  if (reduceMotion) return;
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.3, v = Math.random() * speed + 1; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: .05, r: Math.random() * 2.4 + .8, c: GOLDS[i % 5], l: 0, max: 70 + Math.random() * 60, star: Math.random() < .3 }); }
}
// a little gold under the finger, anywhere on the page
addEventListener('pointerdown', e => { if (!reduceMotion) for (let i = 0; i < 8; i++) { const a = Math.random() * 6.3, v = Math.random() * 2.2 + .6; parts.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a) * v, vy: Math.sin(a) * v - .6, g: .03, r: Math.random() * 1.8 + .6, c: GOLDS[i % 5], l: 0, max: 45, star: i % 3 === 0 }); } }, { passive: true });

/* ---------- countdown (digits roll when they change) ---------- */
let last = [];
function tick() {
  const s = Math.floor((when - Date.now()) / 1000);
  if (s <= 0) { $('cd').outerHTML = `<p class="cd-done">${Date.now() - when < 864e5 ? 'الليلة الليلة! 🤍' : 'الله يتمّم بالخير 🤍'}</p>`; $('calBtn')?.remove(); return false; }
  const v = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
  if (!last.length) $('cd').innerHTML = ['يوم', 'ساعة', 'دقيقة', 'ثانية'].map(l => `<div><b></b><span>${l}</span></div>`).join('');
  $('cd').querySelectorAll('b').forEach((b, i) => {
    if (v[i] === last[i]) return;
    b.textContent = two(v[i]);
    if (hasGsap && !reduceMotion && last.length) gsap.fromTo(b, { y: -10, opacity: .2 }, { y: 0, opacity: 1, duration: .45, ease: 'power3.out' });
  });
  last = v; return true;
}
if (tick()) { const t = setInterval(() => { if (!tick()) clearInterval(t); }, 1000); }

/* ---------- calendar reminder (.ics works on iPhone and Android) ---------- */
$('calBtn').addEventListener('click', () => {
  const z = d => new Date(d).toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Rasael//Engagement//AR', 'BEGIN:VEVENT', `UID:${+when}@rasael`, `DTSTAMP:${z(Date.now())}`,
    `DTSTART:${z(when)}`, `DTEND:${z(+when + 3 * 36e5)}`, `SUMMARY:${ENGAGE.kind} ${ENGAGE.groom} و${ENGAGE.bride} 💍`, `LOCATION:${ENGAGE.venue.name}، ${ENGAGE.venue.address}`, `URL:${location.href}`,
    'BEGIN:VALARM', 'TRIGGER:-PT3H', 'ACTION:DISPLAY', `DESCRIPTION:${ENGAGE.kind} ${ENGAGE.groom} و${ENGAGE.bride} اليوم 🤍`, 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'invitation.ics';
  document.body.appendChild(a); a.click(); a.remove();
});

/* ---------- RSVP through WhatsApp ---------- */
let going = null, count = 2;
if (!ENGAGE.rsvpWhatsapp) $('rsvpSec').remove();
else {
  if (guest) $('rName').value = guest;
  $('by').textContent = ENGAGE.rsvpBy ? `ياريت تردّوا قبل ${new Intl.DateTimeFormat(AR, { day: 'numeric', month: 'long' }).format(new Date(ENGAGE.rsvpBy + 'T12:00:00'))}` : '';
  const drawCount = () => { $('count').textContent = num(count); };
  drawCount();
  $('minus').addEventListener('click', () => { count = Math.max(1, count - 1); drawCount(); });
  $('plus').addEventListener('click', () => { count = Math.min(20, count + 1); drawCount(); });
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    going = b.dataset.v;
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
    $('countRow').style.display = going === 'no' ? 'none' : '';
    $('err').textContent = '';
  }));
  $('send').addEventListener('click', () => {
    const name = $('rName').value.trim();
    if (!name) { $('err').textContent = 'اكتب اسمك لو سمحت'; $('rName').focus(); return; }
    if (!going) { $('err').textContent = 'اختار إذا جايين ولا لأ'; return; }
    const r = $('send').getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 50, 5);
    const msg = [`تأكيد حضور ${ENGAGE.kind} ${ENGAGE.groom} و${ENGAGE.bride} 💍`, `الاسم: ${name}`,
      going === 'yes' ? `إن شاء الله جايين ✅ (العدد: ${num(count)})` : 'للأسف ما منقدر نحضر 🙏، ومبروك من القلب 🤍'].join('\n');
    open(`https://wa.me/${ENGAGE.rsvpWhatsapp}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
  });
}

/* ---------- sound: a soft "clink" and a shimmer when the rings meet ---------- */
function clink() {
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)();
    const note = (f, d, v, dur) => { const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + d; o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05); };
    note(2093, 0, .12, 1.4); note(3136, .04, .08, 1.2); note(2637, .08, .07, 1.3);
    [1047, 1319, 1568, 2093, 2637].forEach((f, i) => note(f, .35 + i * .07, .035, 1.6));
  } catch {}
}
let audio = null;
if (ENGAGE.music) { audio = new Audio(ENGAGE.music); audio.loop = true; }

/* ---------- the rings ---------- */
const APART = 76, TOGETHER = 30;
let linked = false;
if (hasGsap) { gsap.set('#ringA', { x: APART, rotation: 8, svgOrigin: '0 0' }); gsap.set(['#ringB', '#ringBtop'], { x: -APART, rotation: -8, svgOrigin: '0 0' }); }
function showHero() { ['names', 'hSub', 'hDate'].forEach(id => $(id).style.display = 'block'); }
function linkRings() {
  if (linked) return; linked = true;
  clink(); if (audio) audio.play().catch(() => {});
  const rg = $('rings'); rg.removeAttribute('role'); rg.setAttribute('tabindex', '-1'); rg.style.cursor = 'default';
  const done = () => { document.body.classList.remove('locked'); if (window.ScrollTrigger) ScrollTrigger.refresh(); };
  showHero();
  if (!hasGsap || reduceMotion) { if (hasGsap) { gsap.set('#ringA', { x: TOGETHER, rotation: 0 }); gsap.set(['#ringB', '#ringBtop'], { x: -TOGETHER, rotation: 0 }); } $('hint').style.display = 'none'; return done(); }
  gsap.set(['#names .n', '#names .and', '#hSub', '#hDate'], { opacity: 0 });
  const r = rg.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  gsap.timeline({ onComplete: done })
    .to('#hint', { opacity: 0, y: 8, duration: .3 })
    .to('#ringA', { x: TOGETHER, rotation: 0, duration: 1, ease: 'back.out(1.3)' }, 0)
    .to(['#ringB', '#ringBtop'], { x: -TOGETHER, rotation: 0, duration: 1, ease: 'back.out(1.3)' }, 0)
    .add(() => burst(cx, cy, 110, 8), .7)
    .fromTo('#flash', { opacity: 0, scale: .2 }, { opacity: 1, scale: 3.2, duration: .5, ease: 'power2.out' }, .68)
    .to('#flash', { opacity: 0, duration: .9 }, 1.1)
    .set('#hint', { display: 'none' }, 1.1)
    .to('#rings', { scale: .6, y: -10, height: 130, margin: '6px 0 0', duration: 1.1, ease: 'power3.inOut' }, 1.1)
    .fromTo('#names .n, #names .and', { y: 40, opacity: 0, filter: 'blur(14px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', stagger: .18, duration: 1.2, ease: 'power3.out' }, 1.4)
    .fromTo(['#hSub', '#hDate'], { y: 16, opacity: 0 }, { y: 0, opacity: 1, stagger: .15, duration: .9, ease: 'power3.out' }, 2.2)
    .to('#cue', { opacity: .8, duration: .6 }, 2.8);
}
$('rings').addEventListener('click', linkRings);
$('rings').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); linkRings(); } });

/* ---------- scroll scenes ---------- */
const drawOn = sel => document.querySelectorAll(sel).forEach(p => { p.style.strokeDasharray = 1; p.style.strokeDashoffset = 1; });
if (hasGsap && !reduceMotion) {
  gsap.registerPlugin(ScrollTrigger);
  gsap.from(['.moon', '#to', '#kicker', '#rings', '#hint'], { y: 20, opacity: 0, stagger: .12, duration: 1, ease: 'power3.out', delay: .2 });
  gsap.from('#ringA, #ringB, #ringBtop', { scale: .7, opacity: 0, duration: 1.2, ease: 'power3.out', delay: .4, svgOrigin: '0 0' });

  // the card: the gold frame draws itself, then the monogram star, then the text line by line
  drawOn('.card .frame rect, .mono svg rect');
  gsap.set('.card .corner, .card .mono b, .card .il', { opacity: 0 });
  gsap.timeline({ scrollTrigger: { trigger: '#card', start: 'top 75%' } })
    .to('.card .frame rect', { strokeDashoffset: 0, duration: 1.8, stagger: .2, ease: 'power2.inOut' })
    .to('.card .corner', { opacity: 1, duration: .6, stagger: .08 }, .9)
    .to('.mono svg rect', { strokeDashoffset: 0, duration: 1.2, stagger: .15, ease: 'power2.inOut' }, .3)
    .fromTo('.mono b', { opacity: 0, scale: .6 }, { opacity: 1, scale: 1, duration: .8, ease: 'back.out(2)' }, 1.1)
    .fromTo('.card .il', { opacity: 0, y: 14 }, { opacity: 1, y: 0, stagger: .12, duration: .7, ease: 'power3.out' }, 1.2);
  gsap.to('.mono svg', { rotation: 360, duration: 60, repeat: -1, ease: 'none' });

  // the date zooms out of a blur as you scroll
  gsap.fromTo('#wNum', { scale: 2.4, opacity: 0, filter: 'blur(18px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', ease: 'none', scrollTrigger: { trigger: '#dateSec', start: 'top 85%', end: 'top 25%', scrub: .6 } });
  gsap.fromTo('#wDay', { x: 80, opacity: 0 }, { x: 0, opacity: 1, ease: 'none', scrollTrigger: { trigger: '#dateSec', start: 'top 80%', end: 'top 30%', scrub: .6 } });
  gsap.fromTo('#wTime', { x: -80, opacity: 0 }, { x: 0, opacity: 1, ease: 'none', scrollTrigger: { trigger: '#dateSec', start: 'top 80%', end: 'top 30%', scrub: .6 } });

  // the pin draws itself; the programme line fills with gold and each step lights up
  drawOn('.pin path, .pin circle');
  gsap.to('.pin path, .pin circle', { strokeDashoffset: 0, duration: 1.4, stagger: .2, ease: 'power2.inOut', scrollTrigger: { trigger: '.pin', start: 'top 85%' } });
  if ($('prog')) {
    gsap.to('#progFill', { scaleY: 1, ease: 'none', scrollTrigger: { trigger: '#prog', start: 'top 70%', end: 'bottom 55%', scrub: .4 } });
    document.querySelectorAll('#prog li').forEach(li => ScrollTrigger.create({ trigger: li, start: 'center 60%', onEnter: () => li.classList.add('on'), onLeaveBack: () => li.classList.remove('on') }));
  }
  // colour orbs rise one by one; story cards slide in from alternating sides
  gsap.utils.toArray('#orbs span').forEach((o, i) => gsap.from(o, { y: 40, scale: .4, opacity: 0, duration: .9, delay: i * .12, ease: 'back.out(2)', scrollTrigger: { trigger: '#orbs', start: 'top 85%' } }));
  gsap.utils.toArray('#story li').forEach((li, i) => gsap.from(li, { x: i % 2 ? -60 : 60, opacity: 0, duration: 1, ease: 'power3.out', scrollTrigger: { trigger: li, start: 'top 88%' } }));
  gsap.utils.toArray('#gallery img').forEach(img => gsap.from(img, { y: 50, opacity: 0, duration: 1, ease: 'power3.out', scrollTrigger: { trigger: img, start: 'top 90%' } }));
  gsap.utils.toArray('.rv').forEach(el => gsap.fromTo(el, { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 1, ease: 'power3.out', scrollTrigger: { trigger: el, start: 'top 90%' } }));
  // the last words: a shower of gold
  ScrollTrigger.create({ trigger: '.closing .wait', start: 'top 75%', once: true, onEnter: () => { const r = document.querySelector('.closing .wait').getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 80, 6); } });
} else {
  document.querySelectorAll('.rv').forEach(e => e.style.opacity = 1);
}
</script>
</body>
</html>
