<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ملخّص حبّنا</title>
<!-- Link preview (WhatsApp / Instagram). Change per client. -->
<meta property="og:title" content="وصلتك ستوري من يوسف 🤍">
<meta property="og:description" content="ملخّص حبّكن… افتحيها">
<meta name="theme-color" content="#0E0812">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0A0E26;
    --plum: #2B1238;
    --rose: #E23E57;
    --rose-2: #B92B45;
    --coral: #FF8170;
    --pink: #F7A1AE;
    --cream: #FBF1E3;
    --ink: #2B1238;
    --ink-soft: rgba(43, 18, 56, .66);
    --gold: #F2B84B;
    --paper: #FBF5EC;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #07040A; overscroll-behavior: none; }
  body { font-family: "Rubik", system-ui, sans-serif; color: var(--cream); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  svg { display: block; }
  canvas.fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* ===== Avatar (his photo or first letter) ===== */
  .av { display: grid; place-items: center; border-radius: 50%; overflow: hidden; background: linear-gradient(150deg, var(--rose), #6E1D3A); color: var(--cream); font-family: "Aref Ruqaa", serif; line-height: 1; flex: none; }
  .av img { width: 100%; height: 100%; object-fit: cover; }

  /* ===== Cover: "you have a new story" ===== */
  .cover {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px;
    background: radial-gradient(ellipse 75% 50% at 50% 44%, #3A1650 0%, #0E0812 72%);
    text-align: center; cursor: pointer; user-select: none; -webkit-user-select: none;
    transition: opacity .6s, visibility 0s .6s;
  }
  .cover.gone { opacity: 0; visibility: hidden; }
  .cv-top { position: relative; font-size: 15px; letter-spacing: .03em; opacity: .75; }
  .ring { position: relative; width: 150px; height: 150px; border-radius: 50%; padding: 5px; margin: 10px 0 4px; }
  .ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--gold), var(--rose), var(--coral), var(--pink), var(--gold)); animation: spin 5s linear infinite; }
  .cover.opening .ring::before { animation-duration: .5s; }
  .ring .av { position: relative; width: 100%; height: 100%; border: 5px solid #170B1C; font-size: 64px; }
  .ring::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 1px solid rgba(242,184,75,.5); animation: halo 2.4s ease-out infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  @keyframes halo { from { transform: scale(.85); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }
  .cv-name { position: relative; font-weight: 800; font-size: 26px; }
  .cv-hint { position: relative; font-size: 14px; opacity: .65; animation: breathe 2.2s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .3; } }

  /* ===== Story player ===== */
  .player {
    position: fixed; inset: 0; overflow: hidden; background: #000;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    container-type: size; opacity: 0; visibility: hidden; perspective: 1200px;
  }
  .player.cubing .slide { transition: none !important; }
  .player.live { opacity: 1; visibility: visible; transition: opacity .5s; }
  @media (min-width: 620px) and (min-height: 620px) {
    .player { inset: auto; left: 50%; top: 50%; width: min(440px, 92vw); height: min(880px, 94vh); transform: translate(-50%, -50%); border-radius: 22px; box-shadow: 0 40px 120px -30px #000; }
  }
  .top { position: absolute; z-index: 30; top: 0; left: 0; right: 0; padding: calc(10px + env(safe-area-inset-top)) 10px 0; pointer-events: none; color: #fff; transition: color .4s; }
  .player[data-tone="light"] .top { color: var(--ink); }
  .bars { display: flex; gap: 4px; }
  .bars span { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,.3); overflow: hidden; }
  .bars i { display: block; height: 100%; background: currentColor; transform: scaleX(0); transform-origin: right; }
  .player[data-tone="light"] .bars span { background: rgba(43,18,56,.18); }
  .head { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding-inline-start: 2px; }
  .head .av { width: 34px; height: 34px; font-size: 17px; box-shadow: 0 0 0 2px rgba(255,255,255,.5); }
  .head b { font-weight: 700; font-size: 15px; }
  .head small { font-size: 13px; opacity: .7; }
  .snd { margin-inline-start: auto; width: 42px; height: 42px; display: grid; place-items: center; pointer-events: auto; }
  .snd svg { width: 22px; height: 22px; }
  .snd .off, .snd.muted .on { display: none; }
  .snd.muted .off { display: block; }
  .hint { position: absolute; z-index: 30; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom)); text-align: center; font-size: 13px; font-weight: 500; opacity: 0; transition: opacity .5s; pointer-events: none; }
  .player[data-tone="light"] .hint { color: var(--ink); }
  .hint.show { opacity: .7; }
  .hint span { display: inline-block; animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(-6px); } }

  .slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: calc(84px + env(safe-area-inset-top)) 24px calc(54px + env(safe-area-inset-bottom));
    opacity: 0; visibility: hidden; transform: scale(1.05);
    transition: opacity .45s, transform .6s var(--ease), visibility 0s .45s;
    overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .slide.on { opacity: 1; visibility: visible; transform: none; transition: opacity .45s, transform .6s var(--ease); }
  .slide > * { position: relative; }
  .kick { font-weight: 700; font-size: 15px; letter-spacing: .05em; }

  /* 1. Title: their photo in a turning ring, sun rays, the title lands word by word */
  .s-title { background: radial-gradient(ellipse 110% 80% at 50% 32%, #F25A70 0%, var(--rose) 48%, #9E2440 100%); }
  .s-title .rays { position: absolute; left: 50%; top: 36%; width: 240vh; height: 240vh; width: 240cqh; height: 240cqh; transform: translate(-50%, -50%); border-radius: 50%; background: repeating-conic-gradient(rgba(255,255,255,.08) 0 5deg, transparent 5deg 15deg); -webkit-mask: radial-gradient(circle, #000 6%, transparent 44%); mask: radial-gradient(circle, #000 6%, transparent 44%); animation: rays 90s linear infinite; }
  @keyframes rays { to { transform: translate(-50%, -50%) rotate(1turn); } }
  .halo { position: relative; width: 60vw; width: min(62cqw, 34cqh); aspect-ratio: 1; margin-bottom: 14px; }
  .halo .hring { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 26s linear infinite; }
  .halo .orbit { position: absolute; inset: 0; animation: spin 9s linear infinite reverse; }
  .halo .orbit svg { position: absolute; top: -2%; left: 50%; width: 13%; margin-left: -6.5%; color: var(--gold); filter: drop-shadow(0 3px 6px rgba(80,0,20,.45)); }
  .halo .ph { position: absolute; inset: 8%; border-radius: 50%; overflow: hidden; border: 4px solid var(--cream); background: linear-gradient(150deg, #FF9BAA, #B92B45); box-shadow: 0 24px 50px -16px rgba(80,0,20,.65); display: flex; align-items: center; justify-content: center; gap: 5%; color: var(--cream); font-family: "Aref Ruqaa", serif; font-size: 13vw; font-size: min(15cqw, 8cqh); line-height: 1; }
  .halo .ph img { width: 100%; height: 100%; object-fit: cover; }
  .halo .ph svg { width: 20%; color: var(--cream); }
  .s-title .to { display: inline-block; padding: 0 20px 4px; border-radius: 999px; background: var(--cream); color: var(--rose-2); font-family: "Aref Ruqaa", serif; font-weight: 700; font-size: 26px; line-height: 1.55; transform: rotate(-4deg); box-shadow: 0 10px 24px -12px rgba(80,0,20,.6); }
  .s-title h1 { font-weight: 900; font-size: 15vw; font-size: clamp(44px, 15.5cqw, 76px); line-height: 1.15; margin: 12px 0 14px; white-space: nowrap; color: var(--cream); text-shadow: 0 6px 30px rgba(120,10,30,.35); }
  .s-title h1 .w { display: inline-block; }
  .s-title .sub { padding: 5px 16px; border-radius: 999px; background: rgba(43,18,56,.22); font-weight: 500; font-size: 15px; color: #FFE3E7; }
  .s-title .by { margin-top: 12px; font-size: 14px; color: #FFE3E7; opacity: .85; }

  /* Photos: polaroids that drop in one by one, with a camera flash */
  .s-photos { background: radial-gradient(ellipse 100% 70% at 50% 40%, #4A1B5E 0%, #1C0A27 80%); }
  .s-photos .kick { color: var(--pink); }
  .s-photos h2 { font-family: "Aref Ruqaa", serif; font-weight: 700; font-size: 34px; line-height: 1.3; }
  .pics { position: relative; width: 100%; height: 58vh; height: 58cqh; margin-top: 6px; }
  .pics .slot { position: absolute; left: 50%; top: 50%; width: var(--w); transform: translate(-50%, -50%) translate(var(--x), var(--y)) rotate(var(--r)); }
  .pol { position: relative; padding: 3.5% 3.5% 0; background: #FFFDF8; box-shadow: 0 22px 44px -18px rgba(0,0,0,.75); }
  .pol::before { content: ""; position: absolute; z-index: 1; top: -11px; left: 50%; width: 64px; height: 22px; margin-left: -32px; background: rgba(247,161,174,.7); transform: rotate(-4deg); }
  .pol img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: #2A2030; }
  .pol p { font-family: "Aref Ruqaa", serif; font-weight: 700; font-size: 21px; line-height: 1.3; color: #3B1F2B; padding: 8px 4px 12px; }
  .flash { position: absolute; inset: 0; z-index: 5; background: #fff; opacity: 0; pointer-events: none; }

  /* 2. Sky */
  .s-sky { background: radial-gradient(ellipse 120% 80% at 50% 42%, #1A2160 0%, #0A0E26 58%, #04050D 100%); }
  .s-sky .kick { color: var(--gold); }
  .s-sky h2 { font-family: "Aref Ruqaa", serif; font-weight: 700; font-size: 34px; line-height: 1.3; margin-top: 4px; }
  .sky-cv { width: 88vw; width: min(92cqw, 52cqh); aspect-ratio: 1; margin: 6px 0 4px; }
  .s-sky .meta { font-size: 14px; opacity: .75; }
  .moonrow { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; font-size: 17px; font-weight: 500; }
  .moonrow canvas { width: 30px; height: 30px; }
  .s-sky .line { font-family: "Aref Ruqaa", serif; font-size: 24px; line-height: 1.5; color: var(--pink); margin-top: 10px; max-width: 340px; }

  /* 3. Days */
  .s-days { background: var(--cream); color: var(--ink); }
  .s-days .kick { color: var(--rose); }
  .big { font-weight: 900; font-size: 30vw; font-size: clamp(88px, 30cqw, 150px); line-height: 1.05; font-variant-numeric: tabular-nums; }
  .s-days .big { color: var(--rose); margin-top: 6px; }
  .s-days .unit { font-weight: 800; font-size: 34px; margin-top: -4px; }
  .s-days .more { margin-top: 26px; font-size: 17px; line-height: 1.9; color: var(--ink-soft); }
  .s-days .more b { color: var(--ink); font-weight: 800; font-variant-numeric: tabular-nums; }
  .s-days .cap { font-family: "Aref Ruqaa", serif; font-size: 27px; margin-top: 22px; }
  .s-days .heart-bg { position: absolute; width: 120vw; width: 120cqw; left: 50%; top: 50%; transform: translate(-50%, -54%); color: rgba(226,62,87,.06); pointer-events: none; }

  /* 4. Stats */
  .s-stats { background: linear-gradient(170deg, #3E1756, #1C0A27); }
  .s-stats h2 { font-weight: 900; font-size: 36px; line-height: 1.2; }
  .s-stats .kick { color: var(--pink); margin-bottom: 4px; }
  .stats { width: 100%; max-width: 380px; margin-top: 22px; }
  .stat { display: flex; align-items: center; gap: 16px; padding: 16px 4px; border-bottom: 1px solid rgba(255,255,255,.12); text-align: right; }
  .stat:last-child { border-bottom: 0; }
  .stat .n { min-width: 96px; text-align: center; font-weight: 900; font-size: 54px; line-height: 1; color: var(--coral); font-variant-numeric: tabular-nums; }
  .stat .n small { display: block; margin-top: 6px; font-weight: 700; font-size: 14px; color: var(--pink); }
  .stat p { font-size: 18px; font-weight: 500; line-height: 1.5; }

  /* 5. Top list */
  .s-top { background: var(--gold); color: var(--ink); }
  .s-top .kick { color: var(--rose-2); }
  .s-top h2 { font-weight: 900; font-size: 32px; line-height: 1.25; margin-top: 4px; }
  .rank { list-style: none; width: 100%; max-width: 380px; margin-top: 18px; display: grid; gap: 6px; }
  .rank li { display: flex; align-items: center; gap: 14px; padding: 9px 12px; border-radius: 16px; text-align: right; }
  .rank .r { width: 42px; flex: none; text-align: center; font-weight: 900; font-size: 38px; line-height: 1; color: transparent; -webkit-text-stroke: 1.5px var(--ink); }
  .rank b { display: block; font-weight: 800; font-size: 19px; line-height: 1.35; }
  .rank small { display: block; font-size: 14px; line-height: 1.45; opacity: .78; }
  .rank li.one { background: var(--ink); color: var(--cream); box-shadow: 0 16px 34px -16px rgba(43,18,56,.7); }
  .rank li.one .r { color: var(--gold); -webkit-text-stroke: 0; }

  /* 6. Quiz */
  .s-quiz { background: radial-gradient(ellipse 90% 70% at 50% 18%, #5E2034 0%, #2A0E17 75%); }
  .s-quiz .kick { color: var(--gold); }
  .s-quiz > h2 { font-weight: 900; font-size: 30px; margin: 2px 0 18px; }
  .quiz { width: 100%; max-width: 370px; display: flex; flex-direction: column; align-items: center; }
  .qmeta { font-size: 14px; font-weight: 700; color: var(--pink); }
  .qtext { font-weight: 800; font-size: 24px; line-height: 1.45; margin: 8px 0 18px; }
  .opts { display: grid; gap: 10px; width: 100%; }
  .opt { min-height: 54px; padding: 8px 16px; border-radius: 16px; background: rgba(251,241,227,.08); border: 1.5px solid rgba(251,241,227,.28); font-weight: 700; font-size: 18px; transition: background .25s, border-color .25s, color .25s, opacity .25s; }
  .opt:active { transform: scale(.98); }
  .opt.right { background: var(--gold); border-color: var(--gold); color: var(--ink); }
  .opt.wrong { background: var(--rose); border-color: var(--rose); animation: shake .45s; }
  .opt.dim { opacity: .4; }
  @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
  .bubble { display: flex; align-items: flex-end; gap: 8px; width: 100%; margin-top: 16px; opacity: 0; transform: translateY(8px); transition: opacity .4s, transform .4s var(--ease); }
  .bubble.show { opacity: 1; transform: none; }
  .bubble .av { width: 30px; height: 30px; font-size: 15px; }
  .bubble p { background: var(--cream); color: var(--ink); border-radius: 18px 18px 4px 18px; padding: 10px 14px; font-size: 16px; line-height: 1.55; text-align: right; }
  .qnext { margin-top: 16px; min-height: 48px; padding: 0 26px; border-radius: 999px; background: var(--cream); color: var(--ink); font-weight: 800; font-size: 16px; }
  .qnext[hidden] { display: none; }
  .qscore { color: var(--gold); margin-top: 8px; }
  .qscore small { font-size: 30px; color: var(--cream); font-weight: 700; }
  .qres { font-family: "Aref Ruqaa", serif; font-size: 26px; line-height: 1.5; margin-top: 10px; }

  /* 7. Scratch */
  .s-scratch { background: var(--cream); color: var(--ink); }
  .s-scratch .kick { color: var(--rose); }
  .s-scratch h2 { font-weight: 900; font-size: 30px; line-height: 1.3; margin-top: 4px; }
  .ticket { position: relative; width: min(100%, 330px); aspect-ratio: 1.5; margin: 24px auto 0; border-radius: 20px; background: #fff; box-shadow: 0 24px 50px -24px rgba(43,18,56,.55); display: grid; place-items: center; padding: 22px; overflow: hidden; }
  .ticket::before { content: ""; position: absolute; inset: 10px; border: 1.5px dashed rgba(226,62,87,.35); border-radius: 13px; }
  .prize { position: relative; font-family: "Aref Ruqaa", serif; font-weight: 700; font-size: 28px; line-height: 1.45; color: var(--rose-2); }
  .ticket canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; transition: opacity .7s; }
  .ticket.done canvas { opacity: 0; pointer-events: none; }
  .s-scratch .help { margin-top: 14px; font-size: 14px; color: var(--ink-soft); transition: opacity .4s; }
  .s-scratch .note { margin-top: 18px; font-size: 18px; font-weight: 500; line-height: 1.6; max-width: 330px; opacity: 0; transform: translateY(8px); transition: opacity .6s .2s, transform .6s .2s var(--ease); }
  .s-scratch.won .note { opacity: 1; transform: none; }
  .s-scratch.won .help { opacity: 0; }

  /* 8. Letter */
  .s-letter { background: linear-gradient(170deg, var(--rose), #9E2440); }
  .paper {
    width: 100%; max-width: 400px; max-height: 100%; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
    padding: 30px 24px 24px; border-radius: 6px; text-align: right; color: #3B1F2B;
    background-color: var(--paper); background-image: repeating-linear-gradient(transparent 0 33px, rgba(160,110,110,.16) 33px 34px); background-position: 0 20px;
    box-shadow: 0 30px 60px -24px rgba(60,0,20,.6); transform: rotate(-1.2deg);
  }
  .paper h3 { font-family: "Aref Ruqaa", serif; font-weight: 700; font-size: 32px; line-height: 1.4; color: var(--rose-2); }
  .paper p { font-family: "Amiri", serif; font-size: 19px; line-height: 34px; margin-top: 6px; }
  .paper .w { display: inline-block; }
  .paper .sign { text-align: left; font-family: "Aref Ruqaa", serif; font-size: 25px; line-height: 1.4; margin-top: 14px; }
  .paper .sign small { display: block; font-family: "Amiri", serif; font-size: 16px; opacity: .7; }

  /* 9. Ending */
  .s-end { background: radial-gradient(ellipse 100% 70% at 50% 30%, #3A1650 0%, #0A0E26 75%); }
  .s-end h2 { font-family: "Aref Ruqaa", serif; font-weight: 700; font-size: 10vw; font-size: clamp(30px, 10cqw, 44px); line-height: 1.4; }
  .bigheart { width: 124px; height: 116px; margin: 18px auto 4px; color: var(--rose); }
  .bigheart svg { width: 100%; height: 100%; filter: drop-shadow(0 12px 24px rgba(226,62,87,.45)); animation: beat 1.6s ease-in-out infinite; }
  .bigheart:active { transform: scale(.92); }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.08); } 30% { transform: scale(.98); } 45% { transform: scale(1.05); } }
  .hhint { font-size: 14px; opacity: .7; min-height: 22px; }
  .hreply { font-family: "Aref Ruqaa", serif; font-size: 26px; color: var(--pink); min-height: 40px; opacity: 0; transition: opacity .6s; }
  .hreply.show { opacity: 1; }
  .acts { display: grid; gap: 10px; width: 100%; max-width: 330px; margin-top: 12px; }
  .btn { min-height: 52px; padding: 0 22px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 9px; font-weight: 700; font-size: 16px; text-decoration: none; transition: transform .15s; }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 20px; height: 20px; }
  .btn.solid { background: var(--rose); color: #fff; }
  .btn.gold { background: var(--gold); color: var(--ink); }
  .btn.ghost { border: 1.5px solid rgba(251,241,227,.4); color: var(--cream); }
  .credit { margin-top: 16px; font-size: 12px; opacity: .6; }
  .credit a { color: var(--pink); text-decoration: none; }
  @media (max-height: 700px) { .bigheart { width: 92px; height: 86px; margin-top: 10px; } .s-end h2 { font-size: 30px; } .btn { min-height: 48px; } }

  /* ===== Share card preview ===== */
  .share { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; background: rgba(5,4,10,.9); opacity: 0; visibility: hidden; transition: opacity .35s, visibility 0s .35s; }
  .share.show { opacity: 1; visibility: visible; transition: opacity .35s; }
  .share img { max-height: 66vh; max-width: 100%; border-radius: 14px; box-shadow: 0 20px 60px -20px #000; -webkit-touch-callout: default; }
  .share p { font-size: 14px; opacity: .75; text-align: center; }
  .share .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .share .x { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px; width: 46px; height: 46px; display: grid; place-items: center; }
  .share .x svg { width: 22px; height: 22px; }
  .share .wait { font-size: 16px; }

  @media (prefers-reduced-motion: reduce) { .ring::before, .ring::after, .s-title .rays, .halo .hring, .halo .orbit, .cv-hint, .hint span, .bigheart svg { animation: none; } }
</style>
</head>

const LOCALE = 'ar-SY-u-nu-arab';

/* ---------- Sound effects (made live with WebAudio, no files) ---------- */
const SFX = (() => {
  let ctx = null, out = null, nb = null, muted = false, sc = null;
  const mtof = m => 440 * 2 ** ((m - 69) / 12);
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); out = ctx.createGain(); out.gain.value = .5; out.connect(ctx.destination);
    nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const ok = () => ctx && !muted;
  function tone(f, at = 0, dur = .4, { type = 'sine', vol = .2, to = 0, att = .005 } = {}) {
    if (!ok()) return;
    const t = ctx.currentTime + at, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + .05);
  }
  const bell = (m, at = 0, vol = .1, dur = 1.1) => { tone(mtof(m), at, dur, { vol }); tone(mtof(m) * 2.76, at, dur * .4, { vol: vol * .3 }); };
  function noise(at, dur, { vol = .1, type = 'bandpass', f = 2000, to = 0, q = 1 } = {}) {
    if (!ok()) return;
    const t = ctx.currentTime + at, s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = nb; s.loop = true; fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f, t); if (to) fl.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + Math.min(.03, dur / 3)); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(out); s.start(t, Math.random() * .5); s.stop(t + dur + .05);
  }
  const STAR = [86, 88, 90, 93, 95, 98, 100, 102];
  return {
    init,
    get muted() { return muted; },
    set muted(v) { muted = v; if (v && sc) sc.g.gain.value = 0; },
    whoosh: () => noise(0, .34, { vol: .045, f: 500, to: 2600, q: .7 }),
    open: () => [74, 78, 81, 86, 90].forEach((m, i) => bell(m + 12, i * .07, .06)),
    slam: () => { tone(120, 0, .28, { vol: .28, to: 48 }); noise(0, .1, { vol: .05, f: 2600, q: .6 }); },
    sparkle: (at = 0) => [93, 98, 102, 105].forEach((m, i) => bell(m, at + i * .05, .04, .7)),
    twinkle: (at = 0) => bell(STAR[Math.floor(Math.random() * STAR.length)], at, .03, .9),
    chime: () => [74, 78, 81, 85, 88].forEach((m, i) => bell(m + 12, i * .09, .05, 1.4)),
    tick: () => tone(1900, 0, .025, { type: 'square', vol: .012 }),
    ding: () => { bell(88, 0, .1); bell(93, .09, .1); },
    pop: () => { tone(760, 0, .1, { vol: .16, to: 240 }); },
    bwomp: () => { tone(260, 0, .2, { type: 'triangle', vol: .13, to: 200 }); tone(200, .18, .34, { type: 'triangle', vol: .13, to: 120 }); },
    tada: () => { [74, 78, 81, 86].forEach((m, i) => bell(m + 12, i * .06, .08, 1.6)); [98, 102, 105].forEach((m, i) => bell(m, .3 + i * .05, .035, .8)); },
    shutter: () => { noise(0, .045, { vol: .16, f: 4200, q: .5 }); noise(.075, .06, { vol: .12, f: 2600, q: .6 }); tone(1300, 0, .02, { vol: .04 }); },
    thump: () => { tone(95, 0, .24, { vol: .3, to: 50 }); bell(84, .03, .05, .9); },
    paper: () => noise(0, .4, { vol: .05, f: 3600, to: 1800, q: .6 }),
    scratch(speed) {
      if (!ok()) return;
      if (!sc) {
        const s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
        s.buffer = nb; s.loop = true; fl.type = 'bandpass'; fl.frequency.value = 3000; fl.Q.value = .9; g.gain.value = 0;
        s.connect(fl); fl.connect(g); g.connect(out); s.start(); sc = { g, fl };
      }
      const t = ctx.currentTime;
      sc.g.gain.cancelScheduledValues(t); sc.g.gain.setTargetAtTime(Math.min(.16, speed * .01), t, .015); sc.g.gain.setTargetAtTime(0, t + .07, .05);
      sc.fl.frequency.setTargetAtTime(2200 + Math.min(3200, speed * 110), t, .03);
    },
    scratchStop() { if (sc) sc.g.gain.setTargetAtTime(0, ctx.currentTime, .03); }
  };
})();

/* ---------- Floating hearts / bursts ---------- */
class Hearts {
  constructor(canvas, ambient) {
    this.c = canvas; this.x = canvas.getContext('2d'); this.p = []; this.ambient = ambient; this.run = false;
    this.size(); addEventListener('resize', () => this.size());
    if (ambient) for (let i = 0; i < 16; i++) this.p.push(this.make(Math.random() * this.h));
  }
  size() { const d = Math.min(devicePixelRatio || 1, 2); this.w = this.c.clientWidth || innerWidth; this.h = this.c.clientHeight || innerHeight; this.c.width = this.w * d; this.c.height = this.h * d; this.x.setTransform(d, 0, 0, d, 0, 0); }
  make(y) { return { x: Math.random() * this.w, y: y ?? this.h + 20, s: 5 + Math.random() * 9, vy: .25 + Math.random() * .5, vx: 0, sw: Math.random() * 6.3, a: .12 + Math.random() * .3, col: '#F7A1AE', life: Infinity }; }
  burst(cx, cy, cols = ['#E23E57', '#F7A1AE', '#F2B84B'], n = 34) {
    if (reduceMotion) return;
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
      this.p.push({ x: cx, y: cy, s: 6 + Math.random() * 10, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 2, sw: 0, a: 1, life: 90, g: true, col: cols[i % cols.length] });
    }
    this.start();
  }
  heart(x, y, s) { const c = this.x; c.beginPath(); c.moveTo(x, y + s * .3); c.bezierCurveTo(x, y, x - s * .5, y - s * .1, x - s * .5, y + s * .3); c.bezierCurveTo(x - s * .5, y + s * .6, x, y + s * .8, x, y + s); c.bezierCurveTo(x, y + s * .8, x + s * .5, y + s * .6, x + s * .5, y + s * .3); c.bezierCurveTo(x + s * .5, y - s * .1, x, y, x, y + s * .3); c.fill(); }
  start() { if (this.run || reduceMotion) return; this.run = true; requestAnimationFrame(() => this.loop()); }
  stop() { this.run = false; this.x.clearRect(0, 0, this.w, this.h); }
  loop() {
    if (!this.run) return;
    const c = this.x; c.clearRect(0, 0, this.w, this.h);
    this.p = this.p.filter(p => p.life > 0);
    for (const p of this.p) {
      if (p.g) { p.vy += .12; p.vx *= .99; p.life--; p.a = Math.max(0, p.life / 90); }
      else { p.sw += .015; p.vx = Math.sin(p.sw) * .4; if (p.y < -20) Object.assign(p, this.make()); }
      p.x += p.vx; p.y += p.g ? p.vy : -Math.abs(p.vy);
      c.globalAlpha = p.a; c.fillStyle = p.col; this.heart(p.x, p.y, p.s);
    }
    c.globalAlpha = 1;
    if (!this.ambient && !this.p.length) { this.run = false; c.clearRect(0, 0, this.w, this.h); return; }
    requestAnimationFrame(() => this.loop());
  }
}

const D2R = Math.PI / 180;
const norm360 = a => ((a % 360) + 360) % 360;

function altAz(raDeg, decDeg, lst, lat) {
  const H = (lst - raDeg) * D2R, d = decDeg * D2R, p = lat * D2R;
  const e = -Math.cos(d) * Math.sin(H);
  const n = Math.sin(d) * Math.cos(p) - Math.cos(d) * Math.cos(H) * Math.sin(p);
  const u = Math.sin(d) * Math.sin(p) + Math.cos(d) * Math.cos(H) * Math.cos(p);
  return { alt: Math.asin(u), az: Math.atan2(e, n) };
}
// looking up at the sky: north at the top, east on the LEFT, the horizon is the circle
function project(alt, az) { const r = Math.tan((Math.PI / 2 - alt) / 2); return { x: -r * Math.sin(az), y: -r * Math.cos(az) }; }
function moonAndPhase(jd) {
  const d = jd - 2451545;
  const L = 218.316 + 13.176396 * d, M = 134.963 + 13.064993 * d, F = 93.272 + 13.22935 * d;
  const lonDeg = L + 6.289 * Math.sin(M * D2R);

  const ra = Math.atan2(Math.sin(lam) * Math.cos(eps) - Math.tan(bet) * Math.sin(eps), Math.cos(lam)) / D2R;
  const dec = Math.asin(Math.sin(bet) * Math.cos(eps) + Math.cos(bet) * Math.sin(eps) * Math.sin(lam)) / D2R;

  return { ra: norm360(ra), dec, p: norm360(lonDeg - sunLon) / 360 };   // p: 0 new → .5 full → 1 new
}
function moonName(p) {

  if (p < .47 || p > .53) return 'شبه بدر';

const SKY = (() => {
  if (!filled.sky) return null;
  const s = WRAP.sky;
  const [y, m, dd] = WRAP.metDate.slice(0, 10).split('-').map(Number);
  const [hh, mm] = (s.time || '21:00').split(':').map(Number);
  const ms = Date.UTC(y, m - 1, dd, hh - (s.utc ?? 3), mm || 0);
  const jd = ms / 86400000 + 2440587.5;
  const lst = norm360(280.46061837 + 360.98564736629 * (jd - 2451545) + s.lon);
  const byKey = {};
  const stars = [];
  for (const [k, ra, dec, mag, name, tint] of STAR_DATA) {
    const h = altAz(ra * 15, dec, lst, s.lat);
    const pt = { k, mag, name: name || '', tint, alt: h.alt, ...project(h.alt, h.az) };
    byKey[k] = pt;
    if (h.alt > 0) stars.push(pt);
  }
  stars.sort((a, b) => a.mag - b.mag);
  const r = rng(y * 400 + m * 31 + dd);
  stars.forEach((st, i) => { st.ord = i / stars.length; st.seed = r() * 6.3; st.tw = .8 + r() * 1.6; });
  const lines = STAR_LINES.split(' ').map(p => p.split('-').map(k => byKey[k])).filter(([a, b]) => a && b && a.alt > 0 && b.alt > 0);
  const labels = stars.filter(st => st.name && st.k !== 'polaris').slice(0, 5);
  if (byKey.polaris.alt > 0) labels.push(byKey.polaris);
  const consts = CONST_NAMES.map(([name, keys]) => {
    const pts = keys.split(' ').map(k => byKey[k]);
    if (pts.some(p => p.alt < .12)) return null;
    return { name, x: pts.reduce((a, p) => a + p.x, 0) / pts.length, y: pts.reduce((a, p) => a + p.y, 0) / pts.length };
  }).filter(Boolean);
  const dust = Array.from({ length: 420 }, () => { const a = r() * 6.283, d = Math.sqrt(r()) * .98; return { x: Math.cos(a) * d, y: Math.sin(a) * d, s: .5 + r() * .9, a: .06 + r() * .26 }; });

  const mh = altAz(mp.ra, mp.dec, lst, s.lat);
  const moon = { p: mp.p, k: (1 - Math.cos(2 * Math.PI * mp.p)) / 2, alt: mh.alt, ...project(mh.alt, mh.az) };
  return { stars, lines, labels, consts, dust, moon, hh, mm: mm || 0, date: new Date(y, m - 1, dd) };
})();

function drawMoon(c, x, y, r, p, glow) {
  const k = (1 - Math.cos(2 * Math.PI * p)) / 2, waxing = p < .5;

  c.fill();

}

  cur = i;
  const s = SL[i];
  cube(old, s, dir);
  player.dataset.tone = s.el.dataset.tone;
  BARS.forEach((b, k) => { b.style.transition = 'none'; b.style.transform = `scaleX(${k < i ? 1 : 0})`; });
  $('hint').classList.remove('show'); clearTimeout(hintTimer);
  const f = FX[s.key] || {}, dur = typeof f.dur === 'function' ? f.dur() : f.dur ?? 5;
  if (dur) fillBar(dur);
  f.enter?.(s);
}

// Tap like Instagram (RTL): the right edge goes back, everywhere else goes forward
let down = null;
player.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  down = { x: e.clientX, y: e.clientY, t: Date.now(), ix: !!e.target.closest('button, a, .scr, .opts, .bubble') };
});
player.addEventListener('pointerup', e => {
  const d = down; down = null;
  if (!d || d.ix || $('share').classList.contains('show')) return;
  if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 12 || Date.now() - d.t > 550) return;
  const r = player.getBoundingClientRect();
  (e.clientX - r.left) / r.width > .72 ? go(cur - 1) : go(cur + 1);
});
player.addEventListener('pointercancel', () => { down = null; });
addEventListener('keydown', e => {
  if (!player.classList.contains('live') || $('share').classList.contains('show')) return;
  if (e.key === 'ArrowLeft') go(cur + 1);
  if (e.key === 'ArrowRight') go(cur - 1);
});
$('againBtn').addEventListener('click', () => go(0));

/* ---------- Music ---------- */
// one sound button for the music and the effects
const snd = $('snd');
let audio = null, wasPlaying = false;
snd.hidden = false;
if (WRAP.music) {
  audio = new Audio(WRAP.music); audio.loop = true;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { wasPlaying = !audio.paused; audio.pause(); }
    else if (wasPlaying && !SFX.muted) audio.play().catch(() => {});
  });
}
snd.addEventListener('click', () => {
  SFX.muted = !SFX.muted;
  snd.classList.toggle('muted', SFX.muted);
  if (audio) SFX.muted ? audio.pause() : audio.play().catch(() => {});
});

/* ---------- Open the story ---------- */
const cover = $('cover');
function openStory() {
  if (cover.classList.contains('opening')) return;
  cover.classList.add('opening');
  SFX.init(); SFX.open();
  if (audio) audio.play().catch(() => {});
  const show = () => {
    cover.classList.add('gone'); coverFx.stop();
    player.classList.add('live');
    fx = new Hearts($('fx'), false);
    go(0);
    setTimeout(() => cover.remove(), 700);
  };
  if (hasGsap && !reduceMotion) gsap.to('.ring', { scale: 1.12, duration: .7, ease: 'power2.inOut', onComplete: show });
  else show();
}
cover.addEventListener('click', openStory);
cover.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openStory(); } });
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });

/* ============================================================
   SHARE CARD — one picture she can post on her own story
   ============================================================ */
let cardBlob = null;
async function makeCard() {
  try { await Promise.all(['900 120px Rubik', '500 40px Rubik', '700 64px "Aref Ruqaa"'].map(f => document.fonts.load(f))); } catch {}
  const W = 1080, H = 1920, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  const bg = c.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#0A0E26'); bg.addColorStop(.55, '#24103A'); bg.addColorStop(1, '#3A1650');
  c.fillStyle = bg; c.fillRect(0, 0, W, H);
  c.direction = 'rtl'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.fillStyle = '#FBF1E3'; c.font = '900 112px Rubik, sans-serif'; c.fillText('ملخّص حبّنا', W / 2, 250);
  c.fillStyle = '#F7A1AE'; c.font = '700 66px "Aref Ruqaa", serif'; c.fillText(`${WRAP.to} و${WRAP.from}`, W / 2, 365);
  let y = 470;
  if (SKY) {
    drawSky(c, W / 2, 820, 330, { stars: 1, lines: 1, labels: 1, moon: 1, t: 0 });
    c.direction = 'rtl'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.fillStyle = 'rgba(251,241,227,.75)'; c.font = '500 34px Rubik, sans-serif';
    c.fillText(`سما ${WRAP.sky.place} · ${fmtDate(SKY.date)}`, W / 2, 1255);
    c.fillStyle = 'rgba(251,241,227,.92)'; c.font = '500 38px Rubik, sans-serif';
    c.fillText(moonLine, W / 2, 1310);
    y = 1330;
  }
  c.fillStyle = '#FF8170'; c.font = '900 170px Rubik, sans-serif'; c.fillText(num(daysNow()), W / 2, y + 190);
  c.fillStyle = '#FBF1E3'; c.font = '700 48px Rubik, sans-serif'; c.fillText('يوم مع بعض', W / 2, y + 262);
  if (TOP.length) { c.fillStyle = 'rgba(251,241,227,.85)'; c.font = '500 38px Rubik, sans-serif'; c.fillText(G(`نمرة ١ عندو: ${TOP[0].title}`, `نمرة ١ عندها: ${TOP[0].title}`), W / 2, y + 340); }
  c.direction = 'ltr'; c.fillStyle = 'rgba(251,241,227,.55)'; c.font = '500 30px Rubik, sans-serif'; c.fillText(WRAP.credit.handle, W / 2, H - 60);
  return new Promise(r => cv.toBlob(r, 'image/png'));
}
const share = $('share');
$('shareBtn').addEventListener('click', async () => {
  share.classList.add('show'); SFX.shutter();
  if (!cardBlob) {
    cardBlob = await makeCard();
    const url = URL.createObjectURL(cardBlob);
    $('shareImg').src = url; $('shareSave').href = url;
    const file = new File([cardBlob], 'ملخص-حبنا.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      const go2 = $('shareGo'); go2.hidden = false; go2.textContent = G('شاركيها', 'شاركها');
      go2.onclick = () => navigator.share({ files: [file] }).catch(() => {});
    }
    $('shareHelp').textContent = G('أو اضغطي مطوّلاً على الصورة واحفظيها', 'أو اضغط مطوّلاً على الصورة واحفظها');
  }
  $('shareWait').hidden = true; $('shareImg').hidden = false; $('shareHelp').hidden = false; $('shareRow').hidden = false;
});
const closeShare = () => share.classList.remove('show');
$('shareX').addEventListener('click', closeShare);
share.addEventListener('click', e => { if (e.target === share) closeShare(); });
addEventListener('keydown', e => { if (e.key === 'Escape') closeShare(); });
</script>
<!-- rasael-lock: password screen (premium). Set a password to turn it on; leave it empty for no lock. -->
<script>
const LOCK = {
  password: 'نور',                             // e.g. '1203' or 'نور' — empty = no lock
  hint: 'اسم البنت بالمثال',                   // shown under the box, e.g. 'تاريخ أول لقاء (يوم وشهر)'
  forHim: WRAP.forHim,
};
</script>
<style>
  #rlock { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse 80% 60% at 50% 40%, #3A1650, #0E0812); color: #FBF1E6; font-family: "Rubik", system-ui, sans-serif; text-align: center; transition: opacity .7s ease, visibility .7s; }
  #rlock.open { opacity: 0; visibility: hidden; }
  #rlock .box { width: min(340px, 100%); }
  #rlock svg { display: block; width: 58px; height: 58px; color: #F2B84B; margin: 0 auto 14px; transition: transform .5s cubic-bezier(.3,1.6,.5,1); }
  #rlock.open svg { transform: translateY(-8px) rotate(-12deg); }
  #rlock h2 { font-size: 24px; font-weight: 800; line-height: 1.4; }
  #rlock p { opacity: .72; font-size: 15px; margin: 6px 0 22px; line-height: 1.7; }
  #rlock form { display: flex; gap: 8px; }
  #rlock input { flex: 1; min-width: 0; min-height: 52px; border-radius: 14px; border: 1.5px solid rgba(251,241,230,.3); background: rgba(251,241,230,.08); color: inherit; font: inherit; font-size: 20px; text-align: center; letter-spacing: .08em; padding: 0 12px; outline: none; transition: border-color .2s; }
  #rlock input:focus { border-color: #F2B84B; }
  #rlock button { min-height: 52px; min-width: 76px; border: 0; border-radius: 14px; background: #E23E57; color: #fff; font: inherit; font-weight: 700; font-size: 17px; cursor: pointer; }
  #rlock .hint { margin-top: 12px; font-size: 14px; opacity: .65; }
  #rlock .wrong { margin-top: 10px; min-height: 24px; color: #FFB4BE; font-size: 14px; }
  #rlock.shake form { animation: rlock-shake .45s; }
  @keyframes rlock-shake { 20%, 60% { transform: translateX(-9px); } 40%, 80% { transform: translateX(9px); } }
</style>
<script>
(() => {
  if (!LOCK.password) return;
  const norm = s => String(s).trim().toLowerCase().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[\s\/.\-_]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي');
  const KEY = 'rlock:' + location.pathname;
  try { if (sessionStorage.getItem(KEY) === '1') return; } catch {}
  const el = document.createElement('div');
  el.id = 'rlock';
  el.innerHTML = `<div class="box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></svg>
    <h2>${LOCK.forHim ? 'هالستوري إلك إنتَ بس' : 'هالستوري إلك إنتِ بس'}</h2>
    <p>${LOCK.forHim ? 'اكتب كلمة السر لتفتحها' : 'اكتبي كلمة السر لتفتحيها'}</p>
    <form><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="كلمة السر"><button type="submit">افتح</button></form>
    ${LOCK.hint ? `<div class="hint">تلميح: ${LOCK.hint.replace(/</g, '&lt;')}</div>` : ''}
    <div class="wrong" aria-live="polite"></div>
  </div>`;
  document.body.appendChild(el);
  const input = el.querySelector('input'), wrong = el.querySelector('.wrong');
  setTimeout(() => input.focus(), 400);
  let tries = 0;
  el.querySelector('form').addEventListener('submit', e => {
    e.preventDefault();
    if (norm(input.value) === norm(LOCK.password)) {
      try { sessionStorage.setItem(KEY, '1'); } catch {}
      input.blur(); el.classList.add('open');
      setTimeout(() => el.remove(), 800);
    } else {
      tries++;
      wrong.textContent = tries < 3 ? (LOCK.forHim ? 'مو هي… جرّب كمان مرة' : 'مو هي… جرّبي كمان مرة') : (LOCK.forHim ? 'فكّر منيح… شي بتعرفو إنتو التنين بس' : 'فكّري منيح… شي بتعرفو إنتو التنين بس');
      el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
      input.select();
    }
  });
})();
</script>
